<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Object Manipulation</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: system-ui, sans-serif;
    background: #000; color: #fff;
    height: 100vh; display: flex;
    align-items: center; justify-content: center;
  }
  form { display: flex; flex-direction: column; gap: 1rem; width: 18rem; }
  h1 { font-size: 1.1rem; font-weight: 600; text-align: center; letter-spacing: 1px; }
  input {
    background: #111; border: 1px solid #333; border-radius: 0.4rem;
    padding: 0.7rem 0.9rem; color: #fff; font-size: 1rem;
  }
  input:focus { outline: none; border-color: #777; }
  button {
    background: #fff; color: #000; border: 0; border-radius: 0.4rem;
    padding: 0.7rem; font-size: 1rem; font-weight: 600; cursor: pointer;
  }
  .err { color: #e66; font-size: 0.85rem; text-align: center; min-height: 1em; }
</style>
</head>
<body>
  <form method="post" action="/login">
    <h1>Enter password</h1>
    <input type="password" name="password" autofocus autocomplete="off">
    <button type="submit">Continue</button>
    <div class="err" id="err"></div>
  </form>
<script>
  // Surface the server's 401/429 reason without leaking which password failed.
  document.querySelector("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const r = await fetch("/login", { method: "POST", body: new URLSearchParams(fd), redirect: "manual" });
    if (r.type === "opaqueredirect" || r.ok) { window.location = "/"; return; }
    const j = await r.json().catch(() => ({}));
    document.getElementById("err").textContent = j.detail || "Login failed.";
  });
</script>
</body>
</html>
