<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Monkey 3D Game</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        background: #000;
        color: #eee;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        touch-action: none;          /* prevent browser gestures */
        -webkit-user-select: none;
        user-select: none;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* ── Fixed 16:9 game area — letterboxed on any screen shape ─────── */
      #game-area {
        position: relative;
        /* Largest 16:9 rectangle that fits the viewport */
        width: min(100vw, calc(100vh * 16 / 9));
        height: min(100vh, calc(100vw * 9 / 16));
        flex-shrink: 0;
      }

      /* ── Game canvas (Bevy renders here) ───────────────────────────── */
      #game-canvas {
        position: absolute;
        top: 0; left: 0;
        width: 100%;
        height: 100%;
        display: block;
        cursor: none;
      }

      /* ── HUD overlay layer (controller UI) ─────────────────────────── */
      #hud {
        position: absolute;
        top: 0; left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;   /* pass clicks through by default */
        z-index: 20;
      }

      /* ── Status bar (top center) ───────────────────────────────────── */
      #status-bar {
        position: absolute;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        color: rgba(255,255,255,0.35);
        font-size: 0.8em;
        white-space: nowrap;
      }

      /* ── START TRIAL overlay ───────────────────────────────────────── */
      #start-trial-overlay {
        display: none;                /* shown by FSM when WAITING_FOR_START */
        position: fixed;
        top: 0; left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 50;
        background: #000;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        pointer-events: auto;
        cursor: pointer;
      }

      #start-trial-overlay .prompt {
        font-size: 1.6em;
        color: #fff;
        letter-spacing: 1px;
        text-align: center;
        line-height: 1.5;
      }

      /* ── Initial loading overlay ────────────────────────────────────── */
      #loading-overlay {
        position: fixed;
        top: 0; left: 0;
        width: 100vw; height: 100vh;
        background: #000;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 200;
      }

      .loading-box {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        width: min(360px, 75vw);
      }

      .loading-title {
        font-size: 1.1em;
        color: rgba(255,255,255,0.45);
        letter-spacing: 3px;
        text-transform: uppercase;
        margin-bottom: 6px;
      }

      #loading-step {
        font-size: 0.82em;
        color: rgba(255,255,255,0.6);
        text-align: center;
        min-height: 1.2em;
      }

      .loading-bar-track {
        width: 100%;
        height: 4px;
        background: rgba(255,255,255,0.08);
        border-radius: 2px;
        overflow: hidden;
        position: relative;
      }

      .loading-bar-fill {
        height: 100%;
        background: #5bc0fa;
        border-radius: 2px;
        width: 0%;
        transition: width 0.18s ease;
      }

      .loading-bar-fill.indeterminate {
        width: 35% !important;
        transition: none;
        animation: bar-slide 1.3s ease-in-out infinite;
      }

      @keyframes bar-slide {
        0%   { transform: translateX(-200%); }
        100% { transform: translateX(380%); }
      }

      #loading-pct {
        font-size: 0.7em;
        color: rgba(255,255,255,0.28);
        min-height: 1em;
      }

      /* ── Spinner inside start-trial overlay (while textures load) ───── */
      .trial-spinner {
        width: 28px; height: 28px;
        border: 2px solid rgba(255,255,255,0.12);
        border-top-color: rgba(255,255,255,0.55);
        border-radius: 50%;
        animation: spin 0.75s linear infinite;
        display: none;
      }
      .trial-spinner.visible { display: block; }

      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>

  <body>
    <!-- Bevy renders into this canvas -->
    <canvas id="game-canvas"></canvas>

    <!-- Controller HUD overlay -->
    <div id="hud">
      <div id="status-bar">Initializing...</div>
    </div>

    <!-- Initial loading overlay (hidden once game is ready) -->
    <div id="loading-overlay">
      <div class="loading-box">
        <div id="loading-step">Initializing...</div>
        <div class="loading-bar-track">
          <div id="loading-bar-fill" class="loading-bar-fill indeterminate"></div>
        </div>
        <div id="loading-pct"></div>
      </div>
    </div>

    <!-- Start-trial overlay (shown between trials) -->
    <div id="start-trial-overlay">
      <div class="trial-spinner" id="trial-spinner"></div>
      <span class="prompt" id="trial-prompt">Press the screen<br>or press space bar</span>
    </div>

    <!-- Controller logic (ES module) -->
    <script type="module" src="./controller_main.js?v=2"></script>
  </body>
</html>
