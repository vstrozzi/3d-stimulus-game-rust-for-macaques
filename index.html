<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Monkey 3D Game</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        background: #000;
        color: #eee;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        touch-action: none;          /* prevent browser gestures */
        -webkit-user-select: none;
        user-select: none;
      }

      /* ── Game canvas (Bevy renders here) ───────────────────────────── */
      #game-canvas {
        position: fixed;
        top: 0; left: 0;
        width: 100vw;
        height: 100vh;
        display: block;
        cursor: none;
      }

      /* ── HUD overlay layer (controller UI) ─────────────────────────── */
      #hud {
        position: fixed;
        top: 0; left: 0;
        width: 100vw;
        height: 100vh;
        pointer-events: none;   /* pass clicks through by default */
        z-index: 20;
      }

      /* ── Status bar (top center) ───────────────────────────────────── */
      #status-bar {
        position: absolute;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        color: rgba(255,255,255,0.35);
        font-size: 0.8em;
        white-space: nowrap;
      }

      /* ── START TRIAL overlay ───────────────────────────────────────── */
      #start-trial-overlay {
        display: none;                /* shown by FSM when WAITING_FOR_START */
        position: fixed;
        top: 0; left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 50;
        background: #000;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        pointer-events: auto;
        cursor: pointer;
      }

      #start-trial-overlay .prompt {
        font-size: 1.6em;
        color: #fff;
        letter-spacing: 1px;
        text-align: center;
        line-height: 1.5;
      }
    </style>
  </head>

  <body>
    <!-- Bevy renders into this canvas -->
    <canvas id="game-canvas"></canvas>

    <!-- Controller HUD overlay -->
    <div id="hud">
      <div id="status-bar">Initializing...</div>
    </div>

    <!-- Start-trial overlay (shown between trials) -->
    <div id="start-trial-overlay">
      <span class="prompt">Press the screen<br>or press space bar</span>
    </div>

    <!-- Controller logic (ES module) -->
    <script type="module" src="./controller_main.js?v=2"></script>
  </body>
</html>
