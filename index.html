<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monkey 3D Game</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #0a0a14;
    color: #e0e0f0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .landing {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 32px;
    max-width: 480px;
    width: 90%;
  }

  .landing h1 {
    font-size: 2em;
    font-weight: 700;
    letter-spacing: 2px;
    color: #7c6ff7;
  }

  .landing .subtitle {
    font-size: 0.85em;
    color: rgba(255,255,255,0.35);
    text-align: center;
    margin-top: -16px;
  }

  .actions {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
  }

  .action-btn {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 18px 22px;
    background: #1e1e2e;
    border: 2px solid #33334a;
    border-radius: 12px;
    color: #e0e0f0;
    cursor: pointer;
    font-size: 15px;
    font-family: inherit;
    text-align: left;
    transition: border-color 0.15s, background 0.15s;
    text-decoration: none;
  }
  .action-btn:hover {
    border-color: #7c6ff7;
    background: #22223a;
  }

  .action-icon {
    font-size: 1.6em;
    width: 40px;
    text-align: center;
    flex-shrink: 0;
  }

  .action-text .action-title {
    font-weight: 700;
    font-size: 1.05em;
  }
  .action-text .action-desc {
    font-size: 0.8em;
    color: rgba(255,255,255,0.4);
    margin-top: 3px;
  }

  .loaded-info {
    font-size: 0.8em;
    color: #55cc88;
    text-align: center;
    min-height: 1.2em;
  }

  .loaded-info.empty { color: rgba(255,255,255,0.25); }

  .file-input { display: none; }

  /* ── Session name overlay (top-left) — persisted in localStorage and
        used to name the downloaded log zip. ──────────────────────────── */
  .session-name-wrap {
    position: fixed;
    top: 16px;
    left: 16px;
    z-index: 10;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .session-name-wrap label {
    font-size: 0.7em;
    color: rgba(255,255,255,0.4);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .session-name-wrap input {
    background: #1e1e2e;
    border: 1px solid #33334a;
    border-radius: 6px;
    padding: 6px 10px;
    color: #e0e0f0;
    font-family: inherit;
    font-size: 13px;
    width: 220px;
  }
  .session-name-wrap input:focus {
    outline: none;
    border-color: #7c6ff7;
  }
</style>
</head>
<body>

<div class="session-name-wrap">
  <label for="session-name">Session name (for log filenames)</label>
  <input type="text" id="session-name" placeholder="e.g. monkey_A_session_03"
         autocomplete="off" spellcheck="false" maxlength="64">
</div>

<div class="landing">
  <h1>Monkey 3D</h1>

  <div class="actions">
    <!-- Play -->
    <a class="action-btn" id="btn-play" href="./game.html">
      <span class="action-icon">&#9654;</span>
      <span class="action-text">
        <span class="action-title">Play</span>
        <span class="action-desc">Start the game with current trial configuration</span>
      </span>
    </a>

    <!-- Create / Edit Trials -->
    <a class="action-btn" id="btn-edit" href="./trials_config/trial_editor.html">
      <span class="action-icon">&#9998;</span>
      <span class="action-text">
        <span class="action-title">Create / Edit Trials</span>
        <span class="action-desc">Open the trial editor with the current trials.jsonl</span>
      </span>
    </a>

    <!-- Load Custom Trials -->
    <button class="action-btn" id="btn-load">
      <span class="action-icon">&#128194;</span>
      <span class="action-text">
        <span class="action-title">Load Trials</span>
        <span class="action-desc">Load a custom trials.jsonl to use when playing</span>
      </span>
    </button>
    <input type="file" class="file-input" id="file-input" accept=".jsonl,.json">
  </div>

  <div class="loaded-info" id="loaded-info"></div>
</div>

<script>
  const fileInput = document.getElementById('file-input');
  const loadedInfo = document.getElementById('loaded-info');
  const btnLoad = document.getElementById('btn-load');
  const btnPlay = document.getElementById('btn-play');
  const sessionNameInput = document.getElementById('session-name');

  // Session name persists across reloads so participants don't need to
  // re-enter it. The web controller reads `localStorage.session_name`
  // when assembling the downloaded log zip's filename.
  sessionNameInput.value = localStorage.getItem('session_name') || '';
  sessionNameInput.addEventListener('input', () => {
    localStorage.setItem('session_name', sessionNameInput.value);
  });

  // Check if custom trials already in sessionStorage
  function updateInfo() {
    const stored = sessionStorage.getItem('custom_trials_jsonl');
    const name = sessionStorage.getItem('custom_trials_name');
    if (stored) {
      const nLevels = stored.trim().split('\n').filter(l => l.trim()).length;
      loadedInfo.textContent = `Custom trials loaded: ${name || 'custom'} (${nLevels} level${nLevels !== 1 ? 's' : ''})`;
      loadedInfo.className = 'loaded-info';
    } else {
      loadedInfo.textContent = 'Using default trials.jsonl';
      loadedInfo.className = 'loaded-info empty';
    }
  }

  updateInfo();

  btnLoad.addEventListener('click', () => fileInput.click());

  fileInput.addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const text = ev.target.result;
        // Validate: each line should be parseable JSON
        const lines = text.trim().split('\n').filter(l => l.trim());
        lines.forEach((l, i) => {
          try { JSON.parse(l); } catch (err) {
            throw new Error(`Line ${i + 1}: ${err.message}`);
          }
        });
        sessionStorage.setItem('custom_trials_jsonl', text);
        sessionStorage.setItem('custom_trials_name', file.name);
        updateInfo();
      } catch (err) {
        alert('Invalid trials file: ' + err.message);
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  });
</script>
</body>
</html>
