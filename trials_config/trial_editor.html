// ================================================================
// Event attachment (re-run after each render)
// ================================================================
function attachEvents() {
  const editor = document.getElementById('levelEditor');

  // Per-face numeric fields
// Per-face numeric fields
  editor.querySelectorAll('.face-in').forEach(el => {
    el.addEventListener('input', e => {
      const ci    = +e.target.dataset.chain;
      const fi    = +e.target.dataset.face;
      const field = e.target.dataset.field;
      const obj   = levels[sel].objects[ci];

      if (isLocked(obj, ci, fi)) return;

      // Seed: digits only, no sign / decimal / exponent.
      if (field === 'decorations_seeds') {
        const cleaned = e.target.value.replace(/[^0-9]/g, '');
        if (cleaned !== e.target.value) {
          const pos = e.target.selectionStart;
          e.target.value = cleaned;
          try { e.target.setSelectionRange(pos - 1, pos - 1); } catch {}
        }
      }

      let v = +e.target.value || 0;
      if (field === 'decorations_seeds') {
        v = Math.min(Number.MAX_SAFE_INTEGER, Math.max(0, Math.round(v)));
      } else if (field === 'decorations_count') {
        v = Math.max(0, Math.round(v));
      } else if (field === 'decorations_size' || field === 'decorations_thickness') {
        v = Math.max(0, v);
      }
      levels[sel].objects[ci][field][fi] = v;

      const isType2 = obj._type === 'type2';
      const isCustom = obj._type === 'custom';

      if (fi === 0 && !isCustom) {
        for (let i = 0; i < levels[sel].objects.length; i++) {
          if (i !== ci) {
            const otherCustom = levels[sel].objects[i]._type === 'custom';
            if (!otherCustom) {
              levels[sel].objects[i][field][0] = v;
              const sel2 = `.face-in[data-chain="${i}"][data-face="0"][data-field="${field}"]`;
              const el2 = document.querySelector(sel2);
              if (el2) el2.value = v;
            }
          }
        }
      } else if (fi === 1 && isType2) {
        levels[sel].objects[ci][field][2] = v;
        const sel2 = `.face-in[data-chain="${ci}"][data-face="2"][data-field="${field}"]`;
        const el2 = document.querySelector(sel2);
        if (el2) el2.value = v;
      }
      refreshRenderedDecorations();
    });
  });

  // Rotation widget — Rand toggle + degrees input
  editor.querySelectorAll('.rot-rand-btn').forEach(btn => {
    btn.addEventListener('click', e => {
      const [ci, fi] = e.target.dataset.rrand.split('-').map(Number);
      const obj = levels[sel].objects[ci];
      if (isLocked(obj, ci, fi)) return;
      const cur = obj.decorations_rotation[fi];
      const newVal = cur < 0 ? 0 : -1;          // toggle Random ↔ Fixed (0)
      applyRotation(ci, fi, newVal);
      renderLevelEditor(true);
    });
  });
  editor.querySelectorAll('.rot-deg-in').forEach(el => {
    el.addEventListener('input', e => {
      const [ci, fi] = e.target.dataset.rdeg.split('-').map(Number);
      const obj = levels[sel].objects[ci];
      if (isLocked(obj, ci, fi)) return;
      const v = Math.max(0, Math.round(+e.target.value || 0)) % 360;
      applyRotation(ci, fi, v);
      refreshRenderedDecorations();
    });
  });

  // Color pickers — both the color and alpha inputs share a data-cid
  editor.querySelectorAll('input[type=color], input.alpha-in').forEach(el => {
    el.addEventListener('input', () => {
      const colorId = el.dataset.cid;
      applyColorFromId(colorId);
      const textureId = textureIdForColorId(colorId);
      if (textureId) updateRenderedMaterial(textureId);
    });
  });

  // Texture pickers. The floating list can preview an option on hover before
  // committing it, which native <select>/<option> controls cannot expose.
  editor.querySelectorAll('.tex-picker-btn').forEach(button => {
    button.addEventListener('click', () => openTexturePicker(button));
  });

  // Shape buttons
  editor.querySelectorAll('.shape-btn').forEach(el => {
    el.addEventListener('click', e => {
      applyShape(e.target.dataset.sid, +e.target.dataset.sv);
      renderLevelEditor(true);
    });
  });

  // Door selector
  editor.querySelectorAll('.door-sel').forEach(el => {
    el.addEventListener('change', e => {
      const ci = +e.target.dataset.ci;
      const val = e.target.value;
      levels[sel].objects[ci]._type = val; // Store explicit type
      
      if (val === 'type1') {
        levels[sel].objects[ci].target_door = EDITOR_TYPE1_DOOR;
      } else if (val === 'type2') {
        levels[sel].objects[ci].target_door = EDITOR_TYPE2_DOOR;
      }
      // If custom, leave the target_door exactly as whatever the user sets it to!
      
      enforceLevel(levels[sel]); 
      renderAll(); 
    });
  });
  
  editor.querySelectorAll('.door-custom-in').forEach(el => {
    el.addEventListener('change', e => { 
      const ci = +e.target.dataset.ci;
      levels[sel].objects[ci].target_door = Math.max(0, Math.min(N_DOORS - 1, Math.round(+e.target.value)));
      enforceLevel(levels[sel]);
      renderAll(); 
    });
  });
  // Add / remove object buttons
  const addObjBtn = editor.querySelector('#addObjBtn');
  if (addObjBtn) {
    addObjBtn.addEventListener('click', () => {
      const ci = levels[sel].objects.length;
      levels[sel].objects.push(defaultObject(ci));
      enforceLevel(levels[sel]);
      renderAll();
    });
  }
  // Object delete
  editor.querySelectorAll('[data-odel]').forEach(el => {
    el.addEventListener('click', e => {
      const ci = +e.target.dataset.odel;
      levels[sel].objects.splice(ci, 1);
      enforceLevel(levels[sel]);
      renderAll();
    });
  });

  // Object move
  editor.querySelectorAll('[data-omove]').forEach(el => {
    el.addEventListener('click', e => {
      const ci  = +e.target.dataset.omove;
      const dir = +e.target.dataset.dir;
      const arr = levels[sel].objects;
      const ni  = ci + dir;
      if (ni >= 0 && ni < arr.length) {
        // Swap objects
        [arr[ci], arr[ni]] = [arr[ni], arr[ci]];
        enforceLevel(levels[sel]);
        renderAll();
      }
    });
  });

  // Trial field inputs
  editor.querySelectorAll('.trial-in').forEach(el => {
    const evt = el.type === 'checkbox' ? 'change' : 'input';
    el.addEventListener(evt, e => {
      const ti = +e.target.dataset.ti;
      const field = e.target.dataset.tf;
      const boolFields = ['show_all'];
      const intFields = ['nr_attempts_to_win', 'nr_attempts_suggestion', 'nr_attempts_to_retroceed'];
      if (boolFields.includes(field)) {
        levels[sel].trials[ti][field] = !!e.target.checked;
      } else if (intFields.includes(field)) {
        levels[sel].trials[ti][field] = Math.max(0, Math.round(+e.target.value || 0));
      } else {
        levels[sel].trials[ti][field] = Math.max(0, +e.target.value || 0);
      }
    });
  });

  // Trial delete
  editor.querySelectorAll('[data-tdel]').forEach(el => {
    el.addEventListener('click', e => {
      levels[sel].trials.splice(+e.target.dataset.tdel, 1);
      enforceLevel(levels[sel]); // clamp start_trial
      renderAll();
    });
  });

  // Trial move
  editor.querySelectorAll('[data-tmove]').forEach(el => {
    el.addEventListener('click', e => {
      const ti  = +e.target.dataset.tmove;
      const dir = +e.target.dataset.dir;
      const arr = levels[sel].trials;
      const ni  = ti + dir;
      if (ni >= 0 && ni < arr.length) {
        [arr[ti], arr[ni]] = [arr[ni], arr[ti]];
        renderAll();
      }
    });
  });

  // Add trial
  const addBtn = editor.querySelector('#addTrialBtn');
  if (addBtn) {
    addBtn.addEventListener('click', () => {
      levels[sel].trials.push(defaultTrial());
      renderAll();
    });
  }

  // Fixed inputs & selects
  editor.querySelectorAll('.fixed-in').forEach(el => {
    el.addEventListener('change', e => {
      const field = e.target.dataset.ff;
      let val = +e.target.value;
      if (field === 'start_trial') {
        val = Math.max(0, Math.min(Math.round(val), levels[sel].trials.length - 1));
        e.target.value = val;
      } else if (field === 'random_seed') {
        if (!Number.isFinite(val)) val = -1;
        val = Math.trunc(val);
        val = val < 0 ? -1 : Math.min(val, 2147483647);
        e.target.value = val;
      } else if (field === 'firefly_count') {
        val = Math.max(0, Math.round(val));
        e.target.value = val;
      } else if (field === 'cosine_alignment_threshold') {
        val = Math.max(0, Math.min(1, val || 0));
        e.target.value = val;
      } else if (field === 'base_radius' || field === 'height') {
        val = Math.max(0.01, val || 0.01);
        e.target.value = val;
      } else if (field === 'camera_radius') {
        val = Math.max(0.1, val || 0.1);
        e.target.value = val;
      } else if (field !== 'camera_y') {
        val = Math.max(0, val || 0);
        e.target.value = val;
      }
      levels[sel].fixed[field] = val;
    });
  });
  editor.querySelectorAll('.fixed-sel').forEach(el => {
    el.addEventListener('change', e => {
      const field = e.target.dataset.ff;
      // All currently-defined fixed-sel options are integers (e.g. ±1).
      levels[sel].fixed[field] = parseInt(e.target.value, 10);
    });
  });
  editor.querySelectorAll('.fixed-chk').forEach(el => {
    el.addEventListener('change', e => {
      levels[sel].fixed[e.target.dataset.ff] = e.target.checked;
    });
  });
}

// ================================================================
// Color / texture / shape helpers
// ================================================================
// Editor ids of the two backdrop surfaces -> the `fixed` keys they write.
const BACKDROP_MASK_FIELDS = { bdPlatformMask: 'platform_color_mask', bdBackgroundMask: 'background_color_mask' };
const BACKDROP_TEX_FIELDS  = { bdPlatformTex: 'platform_texture', bdBackgroundTex: 'background_texture' };

function applyColorFromId(cid) {
  const rgbEl = document.querySelector(`input[type=color][data-cid="${cid}"]`);
  const aEl   = document.querySelector(`input.alpha-in[data-cid="${cid}"]`);
  if (!rgbEl || !aEl) return;
  const rgba = hexToRgba(rgbEl.value, aEl.value);
  if (BACKDROP_MASK_FIELDS[cid]) { levels[sel].fixed[BACKDROP_MASK_FIELDS[cid]] = rgba; return; }
  const m = cid.match(/^c(\d+)f(\d+)(fc|dc)$/);
  if (!m) return;
  const [, ci, fi, type] = m.map((v, i) => i === 0 ? v : (i <= 2 ? +v : v));
  const obj = levels[sel].objects[ci];

  if (isLocked(obj, ci, fi)) return;

  if (type === 'fc') levels[sel].objects[ci].colors[fi] = rgba;
  else levels[sel].objects[ci].decorations_color[fi] = rgba;

  const isType2 = obj._type === 'type2';
  const isCustom = obj._type === 'custom';

  let needsRerender = false;
  if (fi === 0 && !isCustom) {
    pushFace0ToShared(ci);
    needsRerender = true;
  } else if (fi === 1 && isType2) {
    copyFace(obj, obj, 1, 2);
    needsRerender = true;
  }
  if (needsRerender) renderLevelEditor(true);
}

function applyTexture(id, val) {
  if (BACKDROP_TEX_FIELDS[id]) { levels[sel].fixed[BACKDROP_TEX_FIELDS[id]] = val; return; }
  const m = id.match(/^c(\d+)f(\d+)(ft|dt)$/);
  if (!m) return;
  const ci = +m[1], fi = +m[2], type = m[3];
  const obj = levels[sel].objects[ci];

  if (isLocked(obj, ci, fi)) return;

  if (type === 'ft') levels[sel].objects[ci].textures[fi] = val;
  else levels[sel].objects[ci].decorations_texture[fi] = val;

  const isType2 = obj._type === 'type2';
  const isCustom = obj._type === 'custom';

  let needsRerender = false;
  if (fi === 0 && !isCustom) {
    pushFace0ToShared(ci);
    needsRerender = true;
  } else if (fi === 1 && isType2) {
    copyFace(obj, obj, 1, 2);
    needsRerender = true;
  }
  if (needsRerender) renderLevelEditor(true);
}

function applyRotation(ci, fi, val) {
  const obj = levels[sel].objects[ci];
  if (isLocked(obj, ci, fi)) return;

  obj.decorations_rotation[fi] = val;

  const isType2 = obj._type === 'type2';
  const isCustom = obj._type === 'custom';

  if (fi === 0 && !isCustom) {
    pushFace0ToShared(ci);
  } else if (fi === 1 && isType2) {
    copyFace(obj, obj, 1, 2);
  }
}

function applyShape(id, val) {
  const m = id.match(/^c(\d+)f(\d+)sh$/);
  if (!m) return;
  const ci = +m[1], fi = +m[2];
  const obj = levels[sel].objects[ci];

  if (isLocked(obj, ci, fi)) return;

  levels[sel].objects[ci].decorations_shape[fi] = val;

  const isType2 = obj._type === 'type2';
  const isCustom = obj._type === 'custom';

  if (fi === 0 && !isCustom) {
    pushFace0ToShared(ci);
  } else if (fi === 1 && isType2) {
    copyFace(obj, obj, 1, 2);
  }
}

// ================================================================
// Toolbar actions
// ================================================================
document.getElementById('btnNew').addEventListener('click', () => {
  levels.push(defaultLevel());
  sel = levels.length - 1;
  renderAll();
});

document.getElementById('btnDup').addEventListener('click', () => {
  if (sel < 0) return;
  const clone = deepClone(levels[sel]);
  enforceLevel(clone);
  levels.splice(sel + 1, 0, clone);
  sel += 1;
  renderAll();
});

document.getElementById('btnDel').addEventListener('click', () => {
  if (sel < 0) return;
  levels.splice(sel, 1);
  sel = Math.min(sel, levels.length - 1);
  renderAll();
});

document.getElementById('btnExport').addEventListener('click', () => {
  // `_type` is persisted so re-import is deterministic: a Custom object whose
  // door happens to be 2 or 5 must NOT be silently reclassified as type1/type2
  // on the next load (the inference is door-based and was overwriting custom
  // face data via the shared/mirror constraints).
  const jsonl = levels.map(lv => JSON.stringify(lv)).join('\n') + '\n';
  const a = Object.assign(document.createElement('a'), {
    href: URL.createObjectURL(new Blob([jsonl], {type: 'application/json'})),
    download: fileName,
  });
  a.click();
});

document.getElementById('fileInput').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  setFileName(file.name, 'Imported from disk');
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      levels = ev.target.result.split('\n')
        .map(l => l.trim()).filter(Boolean)
        .map(l => {
          const lv = JSON.parse(l);
          enforceLevel(lv); // re-apply constraints in case imported data violated them
          return lv;
        });
      sel = levels.length > 0 ? 0 : -1;
      renderAll();
    } catch (err) {
      alert('Failed to parse: ' + err.message);
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

// Level list clicks (select + delete + move)
document.getElementById('levelList').addEventListener('click', e => {
  const ldel = e.target.closest('[data-ldel]');
  if (ldel) {
    const i = +ldel.dataset.ldel;
    levels.splice(i, 1);
    if (sel >= levels.length) sel = levels.length - 1;
    renderAll();
    return;
  }

  const lmove = e.target.closest('[data-lmove]');
  if (lmove) {
    const i = +lmove.dataset.lmove;
    const dir = +lmove.dataset.dir;
    const ni = i + dir;
    if (ni >= 0 && ni < levels.length) {
      // Swap levels
      [levels[i], levels[ni]] = [levels[ni], levels[i]];
      // Keep active level highlighted
      if (sel === i) sel = ni;
      else if (sel === ni) sel = i;
      renderAll();
    }
    return;
  }

  const item = e.target.closest('[data-i]');
  if (item) { sel = +item.dataset.i; renderAll(); }
});

// ================================================================
// Init — load WASM constants, then auto-load trials.jsonl
// ================================================================
(async function bootstrap() {
  // 1. Load Rust-side constants (shapes, textures, defaults). Both
  //    init() and the two getter functions are pure — they don't start
  //    Bevy. The production build keeps only the pre-compressed WASM, so
  //    inflate it in-browser just like controller_main.js does.
  const wasmUrl = new URL(
    "../game_node/pkg/game_node_bg.wasm.gz?v=20260824-color-mask",
    import.meta.url,
  );
  const wasmResponse = await fetch(wasmUrl);
  if (!wasmResponse.ok) {
    throw new Error(`Failed to download editor WASM (${wasmResponse.status})`);
  }
  if (!wasmResponse.body || typeof DecompressionStream === 'undefined') {
    throw new Error('This browser cannot decompress the editor WASM package.');
  }
  const wasmBytes = await new Response(
    wasmResponse.body.pipeThrough(new DecompressionStream('gzip')),
  ).arrayBuffer();
  await init({
    module_or_path: wasmBytes,
  });
  const ec = editor_constants();
  const cc = controller_constants();

  TEXTURES = ec.TEXTURE_NAMES;
  SHAPES = ec.SHAPE_NAMES;
  N_FACES = cc.N_FACES;
  N_DOORS = N_FACES * 2;
  FACE_INDICES = Array.from({ length: N_FACES }, (_, i) => i);
  START_ORIENTS = Array.from({ length: cc.N_START_ORIENTS },
                              (_, k) => +(k * 2 * Math.PI / cc.N_START_ORIENTS).toFixed(5));

  // Resolve editor's default texture choices by name so reordering the
  // Rust enum doesn't silently break the defaults. Falls back to index 0.
  const resolveTex = (name) => {
    const idx = Array.from(TEXTURES).indexOf(name);
    if (idx < 0) {
      console.warn(`Editor default texture "${name}" not found in TEXTURES; using index 0.`);
      return 0;
    }
    return idx;
  };
  EDITOR_FACE_TEX_IDX = resolveTex(EDITOR_DEFAULT_FACE_TEXTURE_NAME);
  EDITOR_DECORATION_TEX_IDX = resolveTex(EDITOR_DEFAULT_DECORATION_TEXTURE_NAME);
  PYRAMID_DEFAULTS = {
    base_radius: ec.PYRAMID_BASE_RADIUS,
    height: ec.PYRAMID_HEIGHT,
    door_anim_fade_out: ec.DOOR_ANIM_FADE_OUT,
    door_anim_stay_open: ec.DOOR_ANIM_STAY_OPEN,
    door_anim_fade_in: ec.DOOR_ANIM_FADE_IN,
    decorations_color: ec.PYRAMID_DECORATIONS_COLOR,
  };
  CAMERA_DEFAULTS = {
    initial_radius: ec.CAMERA_3D_INITIAL_RADIUS,
    default_y: ec.DEFAULT_CAMERA_Y,
    speed_rotate: ec.CAMERA_3D_SPEED_ROTATE,
    rotation_sense: ec.CAMERA_ROTATION_SENSE_DEFAULT,
  };
  LIGHTING_DEFAULTS = {
    spotlight_intensity: ec.SPOTLIGHT_LIGHT_INTENSITY,
    ambient_intensity: ec.GLOBAL_AMBIENT_LIGHT_INTENSITY,
    max_spotlight_intensity: ec.MAX_SPOTLIGHT_INTENSITY,
  };
  GAME_DEFAULTS = {
    cosine_alignment_to_win: ec.COSINE_ALIGNMENT_TO_WIN,
    decorations_seeds: ec.DECORATIONS_SEEDS,
  };
  SCENE_DEFAULTS = {
    sound_effects_volume: ec.SOUND_EFFECTS_VOLUME ?? 1.0,
    background_music_volume: ec.BACKGROUND_MUSIC_VOLUME ?? 0.20,
    fog_enabled: ec.FOG_ENABLED ?? true,
    fog_thickness_base: ec.FOG_THICKNESS_BASE ?? 25.0,
    firefly_count: ec.FIREFLY_COUNT ?? 200,
    firefly_size: ec.FIREFLY_SIZE ?? 0.010,
    firefly_expand_secs: ec.FIREFLY_EXPAND_SECS ?? 1.5,
    platform_texture: ec.PLATFORM_TEXTURE ?? 7,
    background_texture: ec.BACKGROUND_TEXTURE ?? 10,
  };

  // Sanity check — drift here means SHAPE_ICONS got out of sync with the Rust
  // DecorationShape enum. Add an icon when you add a variant.
  if (SHAPE_ICONS.length !== SHAPES.length) {
    console.warn(`SHAPE_ICONS (${SHAPE_ICONS.length}) does not match SHAPES (${SHAPES.length}); add a glyph in trial_editor.html.`);
  }

  // 2. Auto-load: the trial selected in the admin menu (this tab) if there is
  //    one, else the server default. Same precedence the game uses, so the
  //    editor never edits a different file than the one that will be played.
  try {
    const selText = sessionStorage.getItem('custom_trials_jsonl');
    const selName = sessionStorage.getItem('custom_trials_name');
    let text = null;
    let name = TRIALS_FILENAME;
    let source = `Loaded from the default ${TRIALS_FILENAME}`;
    if (selText) {
      text = selText;
      name = selName || 'custom.jsonl';
      source = 'Loaded from the trial selected in the menu';
    } else {
      const resp = await fetch(`./trials/${TRIALS_FILENAME}`);
      if (resp.ok) text = await resp.text();
    }
    if (text !== null) {
      levels = text.split('\n')
        .map(l => l.trim()).filter(Boolean)
        .map(l => {
          const lv = JSON.parse(l);
          enforceLevel(lv);
          return lv;
        });
      sel = levels.length > 0 ? 0 : -1;
      setFileName(name, source);
      console.log(`Auto-loaded ${levels.length} levels from ${name}`);
    }
  } catch (e) {
    console.log(`No ${TRIALS_FILENAME} found, starting empty.`, e);
  }
  renderAll();
})().catch(error => {
  console.error('Trial editor failed to start:', error);
  const placeholder = document.getElementById('placeholder');
  placeholder.style.display = '';
  placeholder.textContent = `Failed to start the trial editor: ${error.message}`;
});
</script>
