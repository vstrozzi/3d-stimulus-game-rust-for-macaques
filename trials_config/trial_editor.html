<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Level Configuration Editor</title>
<style>
  :root {
    --bg: #1e1e2e;
    --surface: #2a2a3d;
    --surface2: #33334a;
    --border: #44446a;
    --text: #e0e0f0;
    --text-dim: #8888aa;
    --accent: #7c6ff7;
    --accent-dim: #5a50b0;
    --danger: #e05555;
    --success: #55cc88;
    --chain-a: #4a8fd4;
    --chain-b: #d4884a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Toolbar ── */
  #toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  #toolbar button, #toolbar label {
    padding: 6px 14px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface2);
    color: var(--text);
    cursor: pointer;
    font-size: 13px;
    transition: background .15s;
  }
  #toolbar button:hover, #toolbar label:hover { background: var(--accent-dim); }
  #toolbar .spacer { flex: 1; }
  #toolbar .title { font-weight: 700; font-size: 15px; color: var(--accent); }
  #fileInput { display: none; }

  /* ── Layout ── */
  #main { display: flex; flex: 1; overflow: hidden; }

  /* ── Left panel ── */
  #leftPanel {
    width: 200px;
    min-width: 160px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .panel-header {
    padding: 10px 12px;
    font-weight: 600;
    font-size: 12px;
    color: var(--text-dim);
    border-bottom: 1px solid var(--border);
    text-transform: uppercase;
    letter-spacing: .5px;
    flex-shrink: 0;
  }
  #levelList { flex: 1; overflow-y: auto; padding: 6px; }
  .lv-item {
    display: flex;
    align-items: center;
    padding: 7px 8px;
    border-radius: 6px;
    border: 2px solid transparent;
    cursor: pointer;
    margin-bottom: 4px;
    background: var(--surface2);
    transition: border-color .15s;
    user-select: none;
    font-size: 13px;
  }
  .lv-item:hover { background: #3a3a55; }
  .lv-item.selected { border-color: var(--accent); }
  .lv-item .lv-name { flex: 1; font-weight: 600; }
  .lv-item .lv-meta { font-size: 11px; color: var(--text-dim); margin-right: 4px; }
  /* ── Level List Buttons ── */
  .lv-btns { display: flex; gap: 2px; }
  .lv-btn {
    background: none; border: none; color: var(--text-dim);
    cursor: pointer; font-size: 13px; padding: 2px 4px;
    border-radius: 4px; line-height: 1; transition: color .15s, background .15s;
  }
  .lv-btn:hover { background: var(--surface); color: var(--text); }
  .lv-btn.lv-del:hover { color: var(--danger); }
  .empty-list { color: var(--text-dim); font-size: 12px; padding: 12px; text-align: center; }

  /* ── Object Control Buttons ── */
  .obj-ctrl-btns { display: flex; gap: 4px; margin-left: 8px; padding-left: 8px; border-left: 1px solid var(--border); }
  .obj-ctrl-btns button {
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text-dim); cursor: pointer; font-size: 12px;
    padding: 2px 6px; border-radius: 4px; transition: background .15s;
  }
  .obj-ctrl-btns button:hover { background: var(--accent-dim); color: var(--text); }
  .obj-ctrl-btns .obj-del:hover { background: rgba(224,85,85,.2); color: var(--danger); }


  /* ── Editor panel ── */
  #editorPanel { flex: 1; overflow-y: auto; padding: 16px 20px; }
  #placeholder {
    flex: 1; display: flex; align-items: center; justify-content: center;
    color: var(--text-dim); font-size: 15px;
  }

  /* ── Sections ── */
  .sec-title {
    font-size: 12px; font-weight: 700; color: var(--accent);
    text-transform: uppercase; letter-spacing: .5px;
    padding-bottom: 6px; margin-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }
  .section { margin-bottom: 24px; }

  /* ── Chains grid ── */
  .chains-grid { 
    display: flex; 
    flex-direction: column; 
    gap: 14px; 
  }
  /* ── Object add/remove buttons ── */
  .obj-actions { display: flex; gap: 6px; margin-left: auto; }
  .obj-actions button {
    padding: 3px 10px; border: 1px solid var(--border); border-radius: 5px;
    background: var(--surface2); color: var(--text-dim); cursor: pointer;
    font-size: 12px; transition: background .15s;
  }
  .obj-actions button:hover { background: var(--accent-dim); color: var(--text); }
  .obj-actions .remove-obj:hover { background: rgba(224,85,85,.2); color: var(--danger); }

  /* ── Target door selector ── */
  .target-door-wrap { display: flex; align-items: center; gap: 4px; margin-left: auto; }
  .target-door-wrap select { font-size: 11px; padding: 2px 6px; }
  .target-door-wrap input[type=number] { width: 40px; font-size: 11px; padding: 2px 4px; }

  /* ── Object card ── */
  .obj-card {
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .obj-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    font-weight: 700;
    font-size: 13px;
  }
  .obj-header label { font-size: 12px; color: var(--text-dim); margin-left: auto; }
  .obj-header input[type=number] {
    width: 48px; padding: 3px 5px; font-size: 12px;
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); border-radius: 4px;
  }

  /* ── Read-only span for computed values ── */
  .readonly-val {
    font-size: 11px; color: var(--text); background: var(--surface2);
    border: 1px solid var(--border); border-radius: 4px;
    padding: 3px 6px; font-family: monospace;
  }

  /* ── Face table ── */
  .face-table-wrap { overflow-x: auto; }
  .face-table {
    width: 100%; border-collapse: collapse; font-size: 11px;
  }
  .face-table th {
    padding: 5px 6px; text-align: left; color: var(--text-dim);
    border-bottom: 1px solid var(--border);
    white-space: nowrap; font-weight: 600; font-size: 10px;
    text-transform: uppercase; letter-spacing: .3px;
  }
  .face-table td {
    padding: 5px 6px; vertical-align: middle;
    border-bottom: 1px solid var(--border);
  }
  .face-table tr:last-child td { border-bottom: none; }
  .face-badge {
    display: inline-block; width: 22px; height: 22px; border-radius: 50%;
    line-height: 22px; text-align: center;
    font-size: 10px; font-weight: 700; color: #fff;
    background: var(--border);
  }
  .face-badge.f0 { background: #555577; }
  .face-badge.f1 { background: #557755; }
  .face-badge.f2 { background: #775555; }

  /* ── Face constraint badges ── */
  .face-label-wrap { display: flex; flex-direction: column; gap: 2px; align-items: flex-start; }
  .face-shared-badge {
    font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .3px;
    color: var(--accent); background: rgba(124,111,247,0.15);
    padding: 1px 4px; border-radius: 3px; white-space: nowrap;
  }
  .face-mirror-badge {
    font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .3px;
    color: var(--success); background: rgba(85,204,136,0.15);
    padding: 1px 4px; border-radius: 3px; white-space: nowrap;
  }

  /* ── Locked face row ── */
  tr.face-locked td { background: rgba(0,0,0,0.18); opacity: 0.65; }
  tr.face-locked input, tr.face-locked select, tr.face-locked button {
    pointer-events: none;
  }

  /* ── Inputs ── */
  input[type=number], select {
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); border-radius: 4px; padding: 3px 5px;
    font-size: 12px;
  }
  input[type=number]:focus, select:focus {
    outline: none; border-color: var(--accent);
  }
  .num-sm { width: 56px; }
  .num-xs { width: 44px; }
  select.tex-sel { flex: 1; font-size: 11px; padding: 2px 4px; min-width: 0; }
  .tex-wrap { display: flex; align-items: center; gap: 4px; width: 100%; }
  .tex-thumb {
    width: 24px; height: 24px; border-radius: 3px; border: 1px solid var(--border);
    object-fit: cover; flex-shrink: 0; background: var(--surface2);
  }

  /* ── Color input ── */
  .color-wrap { display: flex; align-items: center; gap: 3px; }
  input[type=color] {
    width: 28px; height: 22px; padding: 1px; border-radius: 3px;
    border: 1px solid var(--border); background: var(--surface2); cursor: pointer;
  }
  .alpha-in { width: 38px; }

  /* ── Rotation widget ── */
  .rot-wrap { display: flex; align-items: center; gap: 3px; }
  .rot-rand-btn {
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text-dim); cursor: pointer; font-size: 10px;
    padding: 2px 5px; border-radius: 4px; font-weight: 600;
  }
  .rot-rand-btn:hover { background: var(--accent-dim); color: var(--text); }
  .rot-rand-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .rot-deg-in:disabled { opacity: 0.35; }

  /* ── Shape buttons ── */
  .shape-btns { display: flex; gap: 2px; }
  .shape-btn {
    width: 22px; height: 22px; border-radius: 4px; border: 1px solid var(--border);
    background: var(--surface2); color: var(--text-dim); cursor: pointer;
    font-size: 11px; line-height: 1; display: flex; align-items: center; justify-content: center;
    transition: background .1s;
  }
  .shape-btn:hover { background: var(--accent-dim); color: var(--text); }
  .shape-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  /* ── Trials section ── */
  .trials-list { display: flex; flex-direction: column; gap: 6px; }
  .trial-row {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 8px 10px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 7px; font-size: 12px;
  }
  .trial-num {
    width: 22px; height: 22px; border-radius: 50%; background: var(--accent);
    color: #fff; font-size: 11px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .trial-field { display: flex; align-items: center; gap: 4px; color: var(--text-dim); }
  .trial-field span { white-space: nowrap; }
  .trial-btns { display: flex; gap: 3px; margin-left: auto; }
  .trial-btns button {
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text-dim); cursor: pointer; font-size: 12px;
    padding: 2px 6px; border-radius: 4px;
  }
  .trial-btns button:hover { background: var(--accent-dim); color: var(--text); }
  .trial-btns .del-btn:hover { background: rgba(224,85,85,.2); color: var(--danger); }
  .add-btn {
    padding: 7px 14px; border: 1px dashed var(--border); border-radius: 7px;
    background: none; color: var(--text-dim); cursor: pointer; font-size: 12px;
    text-align: center; transition: border-color .15s, color .15s;
  }
  .add-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ── Fixed grid ── */
  .fixed-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .fixed-group {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px;
  }
  .fixed-group-title {
    font-size: 11px; font-weight: 700; color: var(--accent);
    text-transform: uppercase; letter-spacing: .4px; margin-bottom: 8px;
  }
  .fixed-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 5px; }
  .fixed-row:last-child { margin-bottom: 0; }
  .fixed-row label { font-size: 11px; color: var(--text-dim); white-space: nowrap; }
  .fixed-row input, .fixed-row select {
    width: 90px; font-size: 11px; padding: 3px 5px;
  }
  .orient-info {
    font-size: 10px; color: var(--text-dim); line-height: 1.5;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 4px; padding: 3px 6px;
  }

  @media (max-width: 900px) {
    .fixed-grid { grid-template-columns: repeat(2, 1fr); }
  }

 /* ── Triangular Compass Styles ── */
  .door-indicator-cell {
    position: relative;
    width: 50px;
    height: 50px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.2);
    border-radius: 4px;
  }
  
  .tri-mini {
    width: 0;
    height: 0;
    border-left: 15px solid transparent;
    border-right: 15px solid transparent;
    border-bottom: 26px solid var(--surface2); /* Equilateral ratio */
    position: relative;
    filter: drop-shadow(0 0 1px var(--border));
  }

  /* Labels for the triangle sides/faces */
  .tri-label {
    position: absolute;
    font-size: 8px;
    font-weight: bold;
    color: var(--text-dim);
    pointer-events: none;
  }

  .golden-dot {
    position: absolute;
    width: 7px;
    height: 7px;
    background: #ffcc00;
    border-radius: 50%;
    box-shadow: 0 0 6px #ffcc00;
    transform: translate(-50%, -50%);
    z-index: 20;
    transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
</style>
</head>
<body>

<div id="toolbar">
  <span class="title">Level Editor</span>
  <button id="btnNew">+ Level</button>
  <button id="btnDup">Duplicate</button>
  <button id="btnDel">Delete</button>
  <div class="spacer"></div>
  <label>Import .jsonl <input type="file" id="fileInput" accept=".jsonl,.json"></label>
  <button id="btnExport">Export JSONL</button>
</div>

<div id="main">
  <div id="leftPanel">
    <div class="panel-header">Levels</div>
    <div id="levelList"></div>
  </div>
  <div id="editorPanel">
    <div id="placeholder">Select or create a level to edit.</div>
    <div id="levelEditor" style="display:none"></div>
  </div>
</div>

<script type="module">
// ================================================================
// Constants — loaded from the shared Rust library (single source of truth)
// ================================================================
// editor_constants() and controller_constants() come from
// shared/src/web.rs via wasm-bindgen. Same source as controller_main.js,
// so renaming a Texture variant in Rust automatically updates the editor.
//
// Texture previews load from game_node/assets/textures/{name}-JPG/bevy_ready/color.png
// Serve over HTTP for previews to work:  python -m http.server 8000

import init, {
  editor_constants,
  controller_constants,
} from "../game_node/pkg/game_node.js";

// Populated on init() — used throughout the editor.
let TEXTURES = null;          // enum Texture variants, by repr
let SHAPES = null;            // enum DecorationShape variants, by repr
let N_FACES = null;           // pyramid faces (= chains per object)
let N_DOORS = null;           // = N_FACES * 2 (hexagonal base)
let FACE_INDICES = null;      // [0, 1, …, N_FACES - 1]
let START_ORIENTS = null;
let PYRAMID_DEFAULTS = null;  // base_radius, height, fade-out/in/stay, colors, etc.
let CAMERA_DEFAULTS = null;   // initial_radius, default_y, speed_rotate, rotation_sense
let LIGHTING_DEFAULTS = null; // spotlight/ambient intensities
let GAME_DEFAULTS = null;     // cosine_alignment_to_win, decorations_seeds
let SCENE_DEFAULTS = null;    // sound effects volume, fog + firefly config
let EDITOR_FACE_TEX_IDX = 0;        // default face texture index (resolved by name)
let EDITOR_DECORATION_TEX_IDX = 0;  // default decoration texture index (resolved by name)

// Editor starting textures, resolved against TEXTURES at init. If a texture
// is renamed/removed in Rust, the lookup falls back to 0 and warns.
const EDITOR_DEFAULT_FACE_TEXTURE_NAME = "WoodFloor057_1K";
const EDITOR_DEFAULT_DECORATION_TEXTURE_NAME = "PavingStones146_1K";

// Editor-only display glyphs — no Rust equivalent. Order must mirror SHAPES.
const SHAPE_ICONS = ["●", "■", "★", "▲", "▭", "⬭", "⬠", "◆", "◇", "⏢", "◖"];

// Relative path from this HTML file to texture assets
const TEXTURE_ASSET_BASE = "../game_node/assets/textures";

// Default trials file — fetched at startup, used as the export filename
// until the user imports a differently-named .jsonl.
const TRIALS_FILENAME = "trials.jsonl";

// ================================================================
// Defaults — derived from Rust constants where one exists; remaining
// values (uniform 20/0.2/0.05 per face etc.) are editor-UX choices.
// ================================================================
// Editor convention: object 0 → "type1" (door 2), object 1 → "type2" (door 5).
// These door indices are an editor concept, not a game constant.
const EDITOR_TYPE1_DOOR = 2;
const EDITOR_TYPE2_DOOR = 5;

// Editor UX starting values for a per-face slot. Game invariants come from
// Rust; everything in this block is an editor-only convenience default.
const EDITOR_DEFAULT_FACE_COLOR = [0.5, 0.5, 0.5, 1];
const EDITOR_DEFAULT_DECORATION_COUNT = 20;
const EDITOR_DEFAULT_DECORATION_SIZE = 0.2;
const EDITOR_DEFAULT_DECORATION_THICKNESS = 0.05;
const EDITOR_DEFAULT_DECORATION_SHAPE = 0;     // index into SHAPES (Circle)
const EDITOR_DEFAULT_DECORATION_ROTATION = 0;  // 0 = fixed, -1 = random

function repeat(value, n) {
  return Array.from({ length: n }, () => (Array.isArray(value) ? value.slice() : value));
}

function defaultObject(chainIdx) {
  return {
    _type: chainIdx === 0 ? 'type1' : 'type2',
    target_door: chainIdx === 0 ? EDITOR_TYPE1_DOOR : EDITOR_TYPE2_DOOR,
    // Neutral starting palette so the user customises rather than inheriting
    // the game's red/green/blue defaults from PYRAMID_COLORS. Face 0 stays
    // dark so the "shared" face stands out from the mirrors.
    colors: [[0,0,0,1], ...repeat(EDITOR_DEFAULT_FACE_COLOR, N_FACES - 1)],
    textures: repeat(EDITOR_FACE_TEX_IDX, N_FACES),
    decorations_seeds: Array.from(GAME_DEFAULTS.decorations_seeds),
    decorations_count: repeat(EDITOR_DEFAULT_DECORATION_COUNT, N_FACES),
    decorations_size: repeat(EDITOR_DEFAULT_DECORATION_SIZE, N_FACES),
    decorations_thickness: repeat(EDITOR_DEFAULT_DECORATION_THICKNESS, N_FACES),
    decorations_texture: repeat(EDITOR_DECORATION_TEX_IDX, N_FACES),
    decorations_shape: repeat(EDITOR_DEFAULT_DECORATION_SHAPE, N_FACES),
    decorations_color: PYRAMID_DEFAULTS.decorations_color.map(c => Array.from(c)),
    // Per-face rotation in degrees. -1 = random rotation per decoration.
    // Multiples of 360 = "no rotation" (treated identically to 0).
    decorations_rotation: repeat(EDITOR_DEFAULT_DECORATION_ROTATION, N_FACES),
  };
}

function defaultTrial() {
  return {
    nr_attempts_to_win: 3,
    nr_attempts_suggestion: 3,
    nr_attempts_to_retroceed: 10,
    elapsed_time_to_win: 4.0,
    elapsed_time_to_retroceed: 10.0,
    show_all: false,
  };
}

function defaultLevel(nObjects = 2) {
  const objs = [];
  for (let i = 0; i < nObjects; i++) objs.push(defaultObject(i));
  const lv = {
    objects: objs,
    trials: [defaultTrial()],
    fixed: {
      // Sentinel: the controller always overrides start_orient with a random
      // choice from START_ORIENTS, so the value stored here is never used.
      // Keeping it -1 makes that obvious in saved JSONL files.
      start_orient: -1,
      start_trial: 0,
      // -1 = controller picks at random; otherwise chain index 0..N-1.
      start_object: -1,
      // If true, completed chains are dropped from the shuffle bag at refill.
      remove_completed_chains: false,
      // -1 = controller draws a fresh entropy seed at level start (and logs
      // the resolved value); any other int → that exact seed.
      random_seed: -1,
      // If false, the controller writes progress_bar_size = 0 every frame,
      // which hides the dots column game-side without changing chain logic.
      show_progress_bar: true,
      score_bar_max: 10,
      shake_amplitude: 0.5,
      shake_duration: 1.0,
      sound_effects_volume: SCENE_DEFAULTS.sound_effects_volume,
      fog_enabled: SCENE_DEFAULTS.fog_enabled,
      fog_thickness_base: SCENE_DEFAULTS.fog_thickness_base,
      firefly_count: SCENE_DEFAULTS.firefly_count,
      firefly_size: SCENE_DEFAULTS.firefly_size,
      firefly_expand_secs: SCENE_DEFAULTS.firefly_expand_secs,
      base_radius: PYRAMID_DEFAULTS.base_radius,
      height: PYRAMID_DEFAULTS.height,
      cosine_alignment_threshold: GAME_DEFAULTS.cosine_alignment_to_win,
      door_anim_fade_out: PYRAMID_DEFAULTS.door_anim_fade_out,
      door_anim_stay_open: PYRAMID_DEFAULTS.door_anim_stay_open,
      door_anim_fade_in: PYRAMID_DEFAULTS.door_anim_fade_in,
      main_spotlight_intensity: LIGHTING_DEFAULTS.spotlight_intensity,
      ambient_brightness: LIGHTING_DEFAULTS.ambient_intensity,
      max_spotlight_intensity: LIGHTING_DEFAULTS.max_spotlight_intensity,
      camera_radius: CAMERA_DEFAULTS.initial_radius,
      camera_y: CAMERA_DEFAULTS.default_y,
      camera_speed_rotate: CAMERA_DEFAULTS.speed_rotate,
      camera_rotation_sense: CAMERA_DEFAULTS.rotation_sense,
    },
  };
  enforceLevel(lv);
  return lv;
}

// ================================================================
// State
// ================================================================
let levels = [];
let sel = -1;
let fileName = TRIALS_FILENAME;

// ================================================================
// Constraint enforcement
// ================================================================

// Copy all per-face fields from srcObj[srcFi] → dstObj[dstFi]
const FACE_FIELDS = [
  'colors', 'textures', 'decorations_seeds', 'decorations_count',
  'decorations_size', 'decorations_thickness', 'decorations_texture',
  'decorations_shape', 'decorations_color', 'decorations_rotation',
];

function copyFace(srcObj, dstObj, srcFi, dstFi) {
  for (const field of FACE_FIELDS) {
    dstObj[field][dstFi] = deepClone(srcObj[field][srcFi]);
  }
}

// Apply all constraints for a level:
//   Type 1 (chain A) face 0 → Type 2 (chain B) face 0  (shared central face)
//   Type 2 (chain B) face 1 → Type 2 (chain B) face 2  (mirror non-shared faces)
function enforceLevel(lv) {
  if (!lv.objects || lv.objects.length < 1) return;
  const f = lv.fixed;
  if (f.start_trial == null) f.start_trial = 0;
  // start_orient is overridden at runtime; force the stored value to the -1
  // sentinel on import so old files don't look like the editor controls it.
  f.start_orient = -1;
  if (f.camera_radius == null) f.camera_radius = CAMERA_DEFAULTS.initial_radius;
  if (f.camera_y == null) f.camera_y = CAMERA_DEFAULTS.default_y;
  if (f.camera_speed_rotate == null) f.camera_speed_rotate = CAMERA_DEFAULTS.speed_rotate;
  if (f.camera_rotation_sense == null) f.camera_rotation_sense = CAMERA_DEFAULTS.rotation_sense;
  delete f.pr_switching_chain;
  if (f.start_object == null) f.start_object = -1;
  if (f.start_object >= 0) f.start_object = Math.min(f.start_object, lv.objects.length - 1);
  if (f.remove_completed_chains == null) f.remove_completed_chains = false;
  f.remove_completed_chains = !!f.remove_completed_chains;
  if (f.random_seed == null) f.random_seed = -1;
  f.random_seed = Math.trunc(f.random_seed);
  if (!Number.isFinite(f.random_seed)) f.random_seed = -1;
  if (f.show_progress_bar == null) f.show_progress_bar = true;
  f.show_progress_bar = !!f.show_progress_bar;
  if (f.score_bar_max == null) f.score_bar_max = 10;
  f.score_bar_max = Math.max(0, Math.round(f.score_bar_max));
  if (f.shake_amplitude == null) f.shake_amplitude = 0.5;
  if (f.shake_duration == null) f.shake_duration = 1.0;
  f.shake_amplitude = Math.max(0, f.shake_amplitude);
  f.shake_duration = Math.max(0, f.shake_duration);
  if (f.sound_effects_volume == null) f.sound_effects_volume = SCENE_DEFAULTS.sound_effects_volume;
  f.sound_effects_volume = Math.max(0, f.sound_effects_volume);
  if (f.fog_enabled == null) f.fog_enabled = SCENE_DEFAULTS.fog_enabled;
  f.fog_enabled = !!f.fog_enabled;
  if (f.fog_thickness_base == null) f.fog_thickness_base = SCENE_DEFAULTS.fog_thickness_base;
  f.fog_thickness_base = Math.max(0, f.fog_thickness_base);
  if (f.firefly_count == null) f.firefly_count = SCENE_DEFAULTS.firefly_count;
  f.firefly_count = Math.max(0, Math.round(f.firefly_count));
  if (f.firefly_size == null) f.firefly_size = SCENE_DEFAULTS.firefly_size;
  f.firefly_size = Math.max(0, f.firefly_size);
  if (f.firefly_expand_secs == null) f.firefly_expand_secs = SCENE_DEFAULTS.firefly_expand_secs;
  f.firefly_expand_secs = Math.max(0, f.firefly_expand_secs);
  for (const t of (lv.trials || [])) {
    if (t.show_all == null) t.show_all = false;
  }
  f.start_trial = Math.min(f.start_trial, Math.max(0, lv.trials.length - 1));

  let firstSharedIdx = -1;
  for (let i = 0; i < lv.objects.length; i++) {
    const obj = lv.objects[i];

    // Backfill per-face fields added in later schema versions.
    if (!Array.isArray(obj.decorations_rotation)) {
      obj.decorations_rotation = repeat(EDITOR_DEFAULT_DECORATION_ROTATION, N_FACES);
    }

    // _type is now persisted in the JSONL. For older files without it, fall
    // back to inferring from `target_door`. This used to clobber custom
    // objects whose door happened to be 2 or 5 — now the inference only
    // runs when `_type` is genuinely missing.
    if (!obj._type) {
      const td = obj.target_door;
      obj._type = td === EDITOR_TYPE1_DOOR ? 'type1' : (td === EDITOR_TYPE2_DOOR ? 'type2' : 'custom');
    }

    // Find master shared object
    if (obj._type === 'type1' || obj._type === 'type2') {
      if (firstSharedIdx === -1) firstSharedIdx = i;
    }
  }

  for (let i = 0; i < lv.objects.length; i++) {
    const isType2 = lv.objects[i]._type === 'type2';
    const isCustom = lv.objects[i]._type === 'custom';

    if (!isCustom) {
      if (firstSharedIdx !== -1 && i !== firstSharedIdx) {
        copyFace(lv.objects[firstSharedIdx], lv.objects[i], 0, 0);
      }
      if (isType2) {
        copyFace(lv.objects[i], lv.objects[i], 1, 2);
      }
    }
  }
}

// Helper: Broadcasts Face 0 to all other shared objects
function pushFace0ToShared(sourceCi) {
  const lv = levels[sel];
  const srcObj = lv.objects[sourceCi];
  for (let i = 0; i < lv.objects.length; i++) {
    if (i === sourceCi) continue;
    const isOtherCustom = lv.objects[i].target_door !== EDITOR_TYPE1_DOOR && lv.objects[i].target_door !== EDITOR_TYPE2_DOOR;
    if (!isOtherCustom) {
      copyFace(srcObj, lv.objects[i], 0, 0);
    }
  }
}

/**
 * Maps the 6 hexagonal doors to a triangular footprint:
 * Door 5: Top Vertex (Over Face 0)
 * Door 0: Right Edge (Between Face 0 and 1)
 * Door 1: Bottom-Right Vertex
 * Door 2: Bottom Edge
 * Door 3: Bottom-Left Vertex
 * Door 4: Left Edge
 */
function getDoorStyle(doorIdx) {
  const coords = [
    { x: '18px',  y: '26px' },   // Door 0 (Bottom-Right Vertex)
    { x: '9px',   y: '15px' },   // Door 1 (Mid-Right Edge)
    { x: '0px',   y: '0px' },    // Door 2 (Top Vertex)
    { x: '-9px',  y: '15px' },   // Door 3 (Mid-Left Edge)
    { x: '-18px', y: '26px' },   // Door 4 (Bottom-Left Vertex)
    { x: '0px',   y: '26px' },   // Door 5 (Bottom-Mid Edge)
  ];
  const pos = coords[doorIdx] || { x: '0px', y: '15px' };
  return `left: ${pos.x}; top: ${pos.y};`;
}

const deepClone = x => JSON.parse(JSON.stringify(x));

function toHex(rgba) {
  return '#' + rgba.slice(0, 3)
    .map(v => Math.round(Math.max(0, Math.min(1, v)) * 255).toString(16).padStart(2, '0'))
    .join('');
}

function hexToRgba(hex, a) {
  return [
    parseInt(hex.slice(1, 3), 16) / 255,
    parseInt(hex.slice(3, 5), 16) / 255,
    parseInt(hex.slice(5, 7), 16) / 255,
    parseFloat(a),
  ];
}

function texThumbUrl(idx) {
  return `${TEXTURE_ASSET_BASE}/${TEXTURES[idx]}-JPG/bevy_ready/color.png`;
}

function texSelectHtml(id, val) {
  const opts = TEXTURES.map((t, i) =>

  return `<span class="tex-wrap">
    <img class="tex-thumb" src="${texThumbUrl(val)}" alt="" onerror="this.style.display='none'">
    <select class="tex-sel" data-id="${id}">${opts}</select>

}

function colorInputHtml(id, rgba) {
  return `<span class="color-wrap">
    <input type="color" data-cid="${id}" value="${toHex(rgba)}">
    <input type="number" class="alpha-in" data-cid="${id}" value="${rgba[3].toFixed(2)}" min="0" max="1" step="0.01">

}

function shapeBtnsHtml(id, val) {

function renderLevelEditor() {
  const editor = document.getElementById('levelEditor');

  const lv = levels[sel];

  editor.innerHTML = `
    <div class="section">
      <div class="sec-title" style="display:flex;align-items:center;gap:10px;">

function renderObject(obj, ci, N) {
  const CHAIN_COLORS = ['var(--chain-a)', 'var(--chain-b)', '#a06cd5', '#5cc9a7', '#e8a735', '#e05555'];
  const colorVar = CHAIN_COLORS[ci % CHAIN_COLORS.length];

  const td = obj.target_door;
  const doorSelVal = obj._type || (td === EDITOR_TYPE1_DOOR ? 'type1' : td === EDITOR_TYPE2_DOOR ? 'type2' : 'custom');
  const isCustom = doorSelVal === 'custom';

  const doorSelect = `<span class="target-door-wrap">
    <select class="door-sel" data-ci="${ci}">
      <option value="type1"${doorSelVal === 'type1' ? ' selected' : ''}>Type 1 (door ${EDITOR_TYPE1_DOOR})</option>
      <option value="type2"${doorSelVal === 'type2' ? ' selected' : ''}>Type 2 (door ${EDITOR_TYPE2_DOOR})</option>
      <option value="custom"${doorSelVal === 'custom' ? ' selected' : ''}>Custom…</option>
    </select>
    <span class="custom-door-label" style="display:${isCustom ? 'inline-flex' : 'none'}; align-items:center; gap:3px; font-size:11px; color:var(--text-dim);">
      Door <input type="number" class="door-custom-in" data-ci="${ci}" min="0" max="${N_DOORS - 1}" value="${td}">
    </span>
    <span class="obj-ctrl-btns">
      ${ci > 0 ? `<button data-omove="${ci}" data-dir="-1" title="Move Up">↑</button>` : ''}
      ${ci < N - 1 ? `<button data-omove="${ci}" data-dir="1" title="Move Down">↓</button>` : ''}
      ${N > 1 ? `<button class="obj-del" data-odel="${ci}" title="Delete">✕</button>` : ''}
    </span>
  </span>`;

  return `
  <div class="obj-card" style="border-color:${colorVar}">
    <div class="obj-header" style="background:color-mix(in srgb, ${colorVar} 15%, transparent);color:${colorVar}">
      <span>Object ${ci}</span>
      ${doorSelect}
    </div>
    <div class="face-table-wrap">
      <table class="face-table">
        <thead><tr>
          <th>Face</th>
          <th>Face Color</th>
          <th>Door</th>
          <th>Face Texture</th>
          <th title="Seed for the Poisson-disk random placement. Set to 0 for a deterministic uniform-grid layout (max spacing in every direction, horizontal split preferred — e.g. n=1 center, n=2 halves, n=4 quadrants).">Seed <span style="color:var(--accent);font-weight:700;" title="0 = deterministic grid (max-spacing) layout">(0 = grid)</span></th>
          <th>Count</th>
          <th>Size</th>
          <th>Thick</th>
          <th>Shape</th>
          <th title="Rotation in degrees around the face normal. 'Rand' picks a random rotation per decoration. Multiples of 360 are equivalent to 0.">Rot°</th>
          <th>Dec Texture</th>
          <th>Dec Color</th>
        </tr></thead>
        <tbody>
          ${FACE_INDICES.map(fi => renderFaceRow(obj, ci, fi)).join('')}
        </tbody>
      </table>
    </div>
  </div>`;
}

function isLocked(obj, ci, fi) {
  const isType2 = obj._type === 'type2';
  const isCustom = obj._type === 'custom';

  if (isCustom) return false;
  if (fi === 2 && isType2) return true;

  return false;
}

function renderFaceRow(obj, ci, fi) {
  const p = `c${ci}f${fi}`;
  const locked = isLocked(obj, ci, fi);
  const trClass = locked ? ' class="face-locked"' : '';
  const isType2 = obj._type === 'type2';
  const isCustom = obj._type === 'custom';

  // Changed ${fi} to D${fi} here:
  let badge = `<span class="face-badge f${fi}">D${fi}</span>`;
  let constraintBadge = '';
  
  if (!isCustom) {
    if (fi === 0) {
      constraintBadge = `<span class="face-shared-badge">⬡ shared</span>`;
    } else if (fi === 1 && isType2) {
      constraintBadge = `<span class="face-mirror-badge">↕ mirror</span>`;
    } else if (fi === 2 && isType2) {
      constraintBadge = `<span class="face-mirror-badge">= f1</span>`;
    }
  }

  const faceCell = `<div class="face-label-wrap">${badge}${constraintBadge}</div>`;
  
  // Changed F0, F1, F2 to D0, D1, D2 here:
  const doorIndicator = `
    <div class="door-indicator-cell">
      <div class="tri-mini">
        <div class="golden-dot" style="${getDoorStyle(obj.target_door)}"></div>
        <span class="tri-label" style="top: 30px; left: -5px; color: var(--accent);">D0</span>
        <span class="tri-label" style="top: 5px; left: 10px;">D1</span>
        <span class="tri-label" style="top: 5px; left: -18px;">D2</span>
      </div>
    </div>
  `;

  return `<tr${trClass}>
    <td>${faceCell}</td>
    <td>${colorInputHtml(`${p}fc`, obj.colors[fi])}</td>
    
    <td>${doorIndicator}</td>

    <td>${texSelectHtml(`${p}ft`, obj.textures[fi])}</td>
    <td><input type="number" class="num-xs face-in" data-chain="${ci}" data-face="${fi}" data-field="decorations_seeds" value="${obj.decorations_seeds[fi]}" min="0" step="1" inputmode="numeric" pattern="\\d*" title="Seed for random Poisson-disk placement. Seed = 0 ⇒ deterministic uniform-grid layout (max spacing, horizontal split preferred)."></td>
    <td><input type="number" class="num-xs face-in" data-chain="${ci}" data-face="${fi}" data-field="decorations_count" value="${obj.decorations_count[fi]}"></td>
    <td><input type="number" class="num-xs face-in" data-chain="${ci}" data-face="${fi}" data-field="decorations_size" value="${obj.decorations_size[fi]}"></td>
    <td><input type="number" class="num-xs face-in" data-chain="${ci}" data-face="${fi}" data-field="decorations_thickness" value="${obj.decorations_thickness[fi]}"></td>
    <td>${shapeBtnsHtml(`${p}sh`, obj.decorations_shape[fi])}</td>
    <td>${rotationInputHtml(ci, fi, obj.decorations_rotation[fi])}</td>
    <td>${texSelectHtml(`${p}dt`, obj.decorations_texture[fi])}</td>
    <td>${colorInputHtml(`${p}dc`, obj.decorations_color[fi])}</td>
  </tr>`;
}

/* Rotation widget: a "Rand" toggle and a degrees number input.
 * Value semantics:
 *   integer ≥ 0 → fixed rotation in degrees (multiples of 360 ≡ 0)
 *   -1          → random rotation per decoration on the face
 */
function rotationInputHtml(ci, fi, val) {
  const isRandom = val < 0;
  return `<span class="rot-wrap" data-chain="${ci}" data-face="${fi}">
    <button class="rot-rand-btn${isRandom ? ' active' : ''}" data-rrand="${ci}-${fi}" title="Random rotation per decoration">Rand</button>
    <input type="number" class="num-xs rot-deg-in" data-rdeg="${ci}-${fi}"
           min="0" max="359" step="15" value="${isRandom ? 0 : val}"
           ${isRandom ? 'disabled' : ''}>
  </span>`;
}

  const numRow = (label, field, val, step, min = '') =>
    `<div class="fixed-row">
      <label>${label}</label>
      <input type="number" class="fixed-in" data-ff="${field}" value="${val}" step="${step}"${min !== '' ? ` min="${min}"` : ''}>

  return `<div class="fixed-grid">

    </div>
    <div class="fixed-group">
      <div class="fixed-group-title">Lighting</div>
      ${numRow('main_intensity', 'main_spotlight_intensity', fixed.main_spotlight_intensity, '1000000', '0')}
      ${numRow('ambient', 'ambient_brightness', fixed.ambient_brightness, '10', '0')}
      ${numRow('max_intensity', 'max_spotlight_intensity', fixed.max_spotlight_intensity, '1000000', '0')}
    </div>
    <div class="fixed-group">
      <div class="fixed-group-title">Scene / Audio</div>
      <div class="fixed-row" title="Linear playback volume for one-shot win/hint sound effects. 1.0 = source level; 0 mutes.">
        ${numRow('sfx_volume', 'sound_effects_volume', fixed.sound_effects_volume ?? 1.0, '0.05', '0')}
      </div>
      <div class="fixed-row" title="Distance fog around the pyramid. Off pushes the fog onset past the wall so nothing is fogged.">
        <label>fog_enabled</label>
        <input type="checkbox" class="fixed-chk" data-ff="fog_enabled"${(fixed.fog_enabled ?? true) ? ' checked' : ''}>
      </div>
      ${numRow('fog_thickness', 'fog_thickness_base', fixed.fog_thickness_base ?? 25.0, '1', '0')}
      ${numRow('firefly_count', 'firefly_count', fixed.firefly_count ?? 10000, '100', '0')}
      ${numRow('firefly_size', 'firefly_size', fixed.firefly_size ?? 0.013, '0.001', '0')}
      ${numRow('firefly_expand_s', 'firefly_expand_secs', fixed.firefly_expand_secs ?? 1.5, '0.1', '0')}
    </div>
  </div>`;
}

// ================================================================
// Render — combined
// ================================================================
function renderAll() {
  renderLevelList();
  renderLevelEditor();
}

// ================================================================
// Event attachment (re-run after each render)
// ================================================================
function attachEvents() {
  const editor = document.getElementById('levelEditor');

  // Per-face numeric fields
// Per-face numeric fields
  editor.querySelectorAll('.face-in').forEach(el => {
    el.addEventListener('input', e => {
      const ci    = +e.target.dataset.chain;
      const fi    = +e.target.dataset.face;
      const field = e.target.dataset.field;
      const obj   = levels[sel].objects[ci];

      if (isLocked(obj, ci, fi)) return;

      // Seed: digits only, no sign / decimal / exponent.
      if (field === 'decorations_seeds') {
        const cleaned = e.target.value.replace(/[^0-9]/g, '');
        if (cleaned !== e.target.value) {
          const pos = e.target.selectionStart;
          e.target.value = cleaned;
          try { e.target.setSelectionRange(pos - 1, pos - 1); } catch {}
        }
      }

      const v = field === 'decorations_seeds' ? Math.round(+e.target.value || 0) : +e.target.value;
      levels[sel].objects[ci][field][fi] = v;

      const isType2 = obj._type === 'type2';
      const isCustom = obj._type === 'custom';

      if (fi === 0 && !isCustom) {
        for (let i = 0; i < levels[sel].objects.length; i++) {
          if (i !== ci) {
            const otherCustom = levels[sel].objects[i]._type === 'custom';
            if (!otherCustom) {
              levels[sel].objects[i][field][0] = v;
              const sel2 = `.face-in[data-chain="${i}"][data-face="0"][data-field="${field}"]`;
              const el2 = document.querySelector(sel2);
              if (el2) el2.value = v;
            }
          }
        }
      } else if (fi === 1 && isType2) {
        levels[sel].objects[ci][field][2] = v;
        const sel2 = `.face-in[data-chain="${ci}"][data-face="2"][data-field="${field}"]`;
        const el2 = document.querySelector(sel2);
        if (el2) el2.value = v;
      }
    });
  });

  // Rotation widget — Rand toggle + degrees input
  editor.querySelectorAll('.rot-rand-btn').forEach(btn => {
    btn.addEventListener('click', e => {
      const [ci, fi] = e.target.dataset.rrand.split('-').map(Number);
      const obj = levels[sel].objects[ci];
      if (isLocked(obj, ci, fi)) return;
      const cur = obj.decorations_rotation[fi];
      const newVal = cur < 0 ? 0 : -1;          // toggle Random ↔ Fixed (0)
      applyRotation(ci, fi, newVal);
      renderLevelEditor();
    });
  });
  editor.querySelectorAll('.rot-deg-in').forEach(el => {
    el.addEventListener('input', e => {
      const [ci, fi] = e.target.dataset.rdeg.split('-').map(Number);
      const obj = levels[sel].objects[ci];
      if (isLocked(obj, ci, fi)) return;
      const v = Math.max(0, Math.round(+e.target.value || 0));
      applyRotation(ci, fi, v);
    });
  });

  // Color pickers — both the color and alpha inputs share a data-cid
  editor.querySelectorAll('input[type=color], input.alpha-in').forEach(el => {
    el.addEventListener('input', () => applyColorFromId(el.dataset.cid));
  });

  // Texture selects
  editor.querySelectorAll('.tex-sel').forEach(el => {
    el.addEventListener('change', e => {
      applyTexture(e.target.dataset.id, +e.target.value);
      // Update thumbnail preview
      const thumb = e.target.closest('.tex-wrap')?.querySelector('.tex-thumb');
      if (thumb) { thumb.src = texThumbUrl(+e.target.value); thumb.style.display = ''; }
    });
  });

  // Shape buttons
  editor.querySelectorAll('.shape-btn').forEach(el => {
    el.addEventListener('click', e => {
      applyShape(e.target.dataset.sid, +e.target.dataset.sv);
      renderLevelEditor();
    });
  });

  // Door selector
  editor.querySelectorAll('.door-sel').forEach(el => {
    el.addEventListener('change', e => {
      const ci = +e.target.dataset.ci;
      const val = e.target.value;
      levels[sel].objects[ci]._type = val; // Store explicit type
      
      if (val === 'type1') {
        levels[sel].objects[ci].target_door = EDITOR_TYPE1_DOOR;
      } else if (val === 'type2') {
        levels[sel].objects[ci].target_door = EDITOR_TYPE2_DOOR;
      }
      // If custom, leave the target_door exactly as whatever the user sets it to!
      
      enforceLevel(levels[sel]); 
      renderAll(); 
    });
  });
  
  editor.querySelectorAll('.door-custom-in').forEach(el => {
    el.addEventListener('change', e => { 
      const ci = +e.target.dataset.ci;
      levels[sel].objects[ci].target_door = Math.max(0, Math.min(N_DOORS - 1, Math.round(+e.target.value)));
      enforceLevel(levels[sel]);
      renderAll(); 
    });
  });
  // Add / remove object buttons
  const addObjBtn = editor.querySelector('#addObjBtn');
  if (addObjBtn) {
    addObjBtn.addEventListener('click', () => {
      const ci = levels[sel].objects.length;
      levels[sel].objects.push(defaultObject(ci));
      enforceLevel(levels[sel]);
      renderAll();
    });
  }
  // Object delete
  editor.querySelectorAll('[data-odel]').forEach(el => {
    el.addEventListener('click', e => {
      const ci = +e.target.dataset.odel;
      levels[sel].objects.splice(ci, 1);
      enforceLevel(levels[sel]);
      renderAll();
    });
  });

  // Object move
  editor.querySelectorAll('[data-omove]').forEach(el => {
    el.addEventListener('click', e => {
      const ci  = +e.target.dataset.omove;
      const dir = +e.target.dataset.dir;
      const arr = levels[sel].objects;
      const ni  = ci + dir;
      if (ni >= 0 && ni < arr.length) {
        // Swap objects
        [arr[ci], arr[ni]] = [arr[ni], arr[ci]];
        enforceLevel(levels[sel]);
        renderAll();
      }
    });
  });

  // Trial field inputs
  editor.querySelectorAll('.trial-in').forEach(el => {
    const evt = el.type === 'checkbox' ? 'change' : 'input';
    el.addEventListener(evt, e => {
      const ti = +e.target.dataset.ti;
      const field = e.target.dataset.tf;
      const boolFields = ['show_all'];
      const intFields = ['nr_attempts_to_win', 'nr_attempts_suggestion', 'nr_attempts_to_retroceed'];
      if (boolFields.includes(field)) {
        levels[sel].trials[ti][field] = !!e.target.checked;
      } else if (intFields.includes(field)) {
        levels[sel].trials[ti][field] = Math.round(+e.target.value);
      } else {
        levels[sel].trials[ti][field] = +e.target.value;
      }
    });
  });

  // Trial delete
  editor.querySelectorAll('[data-tdel]').forEach(el => {
    el.addEventListener('click', e => {
      levels[sel].trials.splice(+e.target.dataset.tdel, 1);
      enforceLevel(levels[sel]); // clamp start_trial
      renderAll();
    });
  });

  // Trial move
  editor.querySelectorAll('[data-tmove]').forEach(el => {
    el.addEventListener('click', e => {
      const ti  = +e.target.dataset.tmove;
      const dir = +e.target.dataset.dir;
      const arr = levels[sel].trials;
      const ni  = ti + dir;
      if (ni >= 0 && ni < arr.length) {
        [arr[ti], arr[ni]] = [arr[ni], arr[ti]];
        renderAll();
      }
    });
  });

  // Add trial
  const addBtn = editor.querySelector('#addTrialBtn');
  if (addBtn) {
    addBtn.addEventListener('click', () => {
      levels[sel].trials.push(defaultTrial());
      renderAll();
    });
  }

  // Fixed inputs & selects
  editor.querySelectorAll('.fixed-in').forEach(el => {
    el.addEventListener('change', e => {
      const field = e.target.dataset.ff;
      let val = +e.target.value;
      if (field === 'start_trial') {
        val = Math.max(0, Math.min(Math.round(val), levels[sel].trials.length - 1));
        e.target.value = val;
      } else if (field === 'score_bar_max') {
        val = Math.max(0, Math.round(val));
        e.target.value = val;
      } else if (field === 'random_seed') {
        if (!Number.isFinite(val)) val = -1;
        val = Math.trunc(val);
        e.target.value = val;
      } else if (field === 'firefly_count') {
        val = Math.max(0, Math.round(val));
        e.target.value = val;
      }
      levels[sel].fixed[field] = val;
    });
  });
  editor.querySelectorAll('.fixed-sel').forEach(el => {
    el.addEventListener('change', e => {
      const field = e.target.dataset.ff;
      // All currently-defined fixed-sel options are integers (e.g. ±1).
      levels[sel].fixed[field] = parseInt(e.target.value, 10);
    });
  });
  editor.querySelectorAll('.fixed-chk').forEach(el => {
    el.addEventListener('change', e => {
      levels[sel].fixed[e.target.dataset.ff] = e.target.checked;
    });
  });
}

// ================================================================
// Color / texture / shape helpers
// ================================================================
function applyColorFromId(cid) {
  const rgbEl = document.querySelector(`input[type=color][data-cid="${cid}"]`);
  const aEl   = document.querySelector(`input.alpha-in[data-cid="${cid}"]`);
  if (!rgbEl || !aEl) return;
  const rgba = hexToRgba(rgbEl.value, aEl.value);
  const m = cid.match(/^c(\d)f(\d)(fc|dc)$/);
  if (!m) return;
  const [, ci, fi, type] = m.map((v, i) => i === 0 ? v : (i <= 2 ? +v : v));
  const obj = levels[sel].objects[ci];

  if (isLocked(obj, ci, fi)) return;

  if (type === 'fc') levels[sel].objects[ci].colors[fi] = rgba;
  else levels[sel].objects[ci].decorations_color[fi] = rgba;

  const isType2 = obj._type === 'type2';
  const isCustom = obj._type === 'custom';

  let needsRerender = false;
  if (fi === 0 && !isCustom) {
    pushFace0ToShared(ci);
    needsRerender = true;
  } else if (fi === 1 && isType2) {
    copyFace(obj, obj, 1, 2);
    needsRerender = true;
  }
  if (needsRerender) renderLevelEditor();
}

function applyTexture(id, val) {
  const m = id.match(/^c(\d)f(\d)(ft|dt)$/);
  if (!m) return;
  const ci = +m[1], fi = +m[2], type = m[3];
  const obj = levels[sel].objects[ci];

  if (isLocked(obj, ci, fi)) return;

  if (type === 'ft') levels[sel].objects[ci].textures[fi] = val;
  else levels[sel].objects[ci].decorations_texture[fi] = val;

  const isType2 = obj._type === 'type2';
  const isCustom = obj._type === 'custom';

  let needsRerender = false;
  if (fi === 0 && !isCustom) {
    pushFace0ToShared(ci);
    needsRerender = true;
  } else if (fi === 1 && isType2) {
    copyFace(obj, obj, 1, 2);
    needsRerender = true;
  }
  if (needsRerender) renderLevelEditor();
}

function applyRotation(ci, fi, val) {
  const obj = levels[sel].objects[ci];
  if (isLocked(obj, ci, fi)) return;

  obj.decorations_rotation[fi] = val;

  const isType2 = obj._type === 'type2';
  const isCustom = obj._type === 'custom';

  if (fi === 0 && !isCustom) {
    pushFace0ToShared(ci);
  } else if (fi === 1 && isType2) {
    copyFace(obj, obj, 1, 2);
  }
}

function applyShape(id, val) {
  const m = id.match(/^c(\d)f(\d)sh$/);
  if (!m) return;
  const ci = +m[1], fi = +m[2];
  const obj = levels[sel].objects[ci];

  if (isLocked(obj, ci, fi)) return;

  levels[sel].objects[ci].decorations_shape[fi] = val;

  const isType2 = obj._type === 'type2';
  const isCustom = obj._type === 'custom';

  let needsRerender = false;
  if (fi === 0 && !isCustom) {
    pushFace0ToShared(ci);
    needsRerender = true;
  } else if (fi === 1 && isType2) {
    copyFace(obj, obj, 1, 2);
    needsRerender = true;
  }
  if (needsRerender) renderLevelEditor();
}

// ================================================================
// Toolbar actions
// ================================================================
document.getElementById('btnNew').addEventListener('click', () => {
  levels.push(defaultLevel());
  sel = levels.length - 1;
  renderAll();
});

document.getElementById('btnDup').addEventListener('click', () => {
  if (sel < 0) return;
  const clone = deepClone(levels[sel]);
  enforceLevel(clone);
  levels.splice(sel + 1, 0, clone);
  sel += 1;
  renderAll();
});

document.getElementById('btnDel').addEventListener('click', () => {
  if (sel < 0) return;
  levels.splice(sel, 1);
  sel = Math.min(sel, levels.length - 1);
  renderAll();
});

document.getElementById('btnExport').addEventListener('click', () => {
  // `_type` is persisted so re-import is deterministic: a Custom object whose
  // door happens to be 2 or 5 must NOT be silently reclassified as type1/type2
  // on the next load (the inference is door-based and was overwriting custom
  // face data via the shared/mirror constraints).
  const jsonl = levels.map(lv => JSON.stringify(lv)).join('\n') + '\n';
  const a = Object.assign(document.createElement('a'), {
    href: URL.createObjectURL(new Blob([jsonl], {type: 'application/json'})),
    download: fileName,
  });
  a.click();
});

document.getElementById('fileInput').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  fileName = file.name;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      levels = ev.target.result.split('\n')
        .map(l => l.trim()).filter(Boolean)
        .map(l => {
          const lv = JSON.parse(l);
          enforceLevel(lv); // re-apply constraints in case imported data violated them
          return lv;
        });
      sel = levels.length > 0 ? 0 : -1;
      renderAll();
    } catch (err) {
      alert('Failed to parse: ' + err.message);
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

// Level list clicks (select + delete + move)
document.getElementById('levelList').addEventListener('click', e => {
  const ldel = e.target.closest('[data-ldel]');
  if (ldel) {
    const i = +ldel.dataset.ldel;
    levels.splice(i, 1);
    if (sel >= levels.length) sel = levels.length - 1;
    renderAll();
    return;
  }

  const lmove = e.target.closest('[data-lmove]');
  if (lmove) {
    const i = +lmove.dataset.lmove;
    const dir = +lmove.dataset.dir;
    const ni = i + dir;
    if (ni >= 0 && ni < levels.length) {
      // Swap levels
      [levels[i], levels[ni]] = [levels[ni], levels[i]];
      // Keep active level highlighted
      if (sel === i) sel = ni;
      else if (sel === ni) sel = i;
      renderAll();
    }
    return;
  }

  const item = e.target.closest('[data-i]');
  if (item) { sel = +item.dataset.i; renderAll(); }
});

// ================================================================
// Init — load WASM constants, then auto-load trials.jsonl
// ================================================================
(async function bootstrap() {
  // 1. Load Rust-side constants (shapes, textures, defaults). Both
  //    init() and the two getter functions are pure — they don't start
  //    Bevy. controller_main.js loads the same module.
  await init();
  const ec = editor_constants();
  const cc = controller_constants();

  TEXTURES = ec.TEXTURE_NAMES;
  SHAPES = ec.SHAPE_NAMES;
  N_FACES = cc.N_FACES;
  N_DOORS = N_FACES * 2;
  FACE_INDICES = Array.from({ length: N_FACES }, (_, i) => i);
  START_ORIENTS = Array.from({ length: cc.N_START_ORIENTS },
                              (_, k) => +(k * 2 * Math.PI / cc.N_START_ORIENTS).toFixed(5));

  // Resolve editor's default texture choices by name so reordering the
  // Rust enum doesn't silently break the defaults. Falls back to index 0.
  const resolveTex = (name) => {
    const idx = Array.from(TEXTURES).indexOf(name);
    if (idx < 0) {
      console.warn(`Editor default texture "${name}" not found in TEXTURES; using index 0.`);
      return 0;
    }
    return idx;
  };
  EDITOR_FACE_TEX_IDX = resolveTex(EDITOR_DEFAULT_FACE_TEXTURE_NAME);
  EDITOR_DECORATION_TEX_IDX = resolveTex(EDITOR_DEFAULT_DECORATION_TEXTURE_NAME);
  PYRAMID_DEFAULTS = {
    base_radius: ec.PYRAMID_BASE_RADIUS,
    height: ec.PYRAMID_HEIGHT,
    door_anim_fade_out: ec.DOOR_ANIM_FADE_OUT,
    door_anim_stay_open: ec.DOOR_ANIM_STAY_OPEN,
    door_anim_fade_in: ec.DOOR_ANIM_FADE_IN,
    decorations_color: ec.PYRAMID_DECORATIONS_COLOR,
  };
  CAMERA_DEFAULTS = {
    initial_radius: ec.CAMERA_3D_INITIAL_RADIUS,
    default_y: ec.DEFAULT_CAMERA_Y,
    speed_rotate: ec.CAMERA_3D_SPEED_ROTATE,
    rotation_sense: ec.CAMERA_ROTATION_SENSE_DEFAULT,
  };
  LIGHTING_DEFAULTS = {
    spotlight_intensity: ec.SPOTLIGHT_LIGHT_INTENSITY,
    ambient_intensity: ec.GLOBAL_AMBIENT_LIGHT_INTENSITY,
    max_spotlight_intensity: ec.MAX_SPOTLIGHT_INTENSITY,
  };
  GAME_DEFAULTS = {
    cosine_alignment_to_win: ec.COSINE_ALIGNMENT_TO_WIN,
    decorations_seeds: ec.DECORATIONS_SEEDS,
  };
  SCENE_DEFAULTS = {
    sound_effects_volume: ec.SOUND_EFFECTS_VOLUME ?? 1.0,
    fog_enabled: ec.FOG_ENABLED ?? true,
    fog_thickness_base: ec.FOG_THICKNESS_BASE ?? 25.0,
    firefly_count: ec.FIREFLY_COUNT ?? 200,
    firefly_size: ec.FIREFLY_SIZE ?? 0.010,
    firefly_expand_secs: ec.FIREFLY_EXPAND_SECS ?? 1.5,
  };

  // Sanity check — drift here means SHAPE_ICONS got out of sync with the Rust
  // DecorationShape enum. Add an icon when you add a variant.
  if (SHAPE_ICONS.length !== SHAPES.length) {
    console.warn(`SHAPE_ICONS (${SHAPE_ICONS.length}) does not match SHAPES (${SHAPES.length}); add a glyph in trial_editor.html.`);
  }

  // 2. Auto-load trials file
  try {
    const resp = await fetch(`./${TRIALS_FILENAME}`);
    if (resp.ok) {
      const text = await resp.text();
      levels = text.split('\n')
        .map(l => l.trim()).filter(Boolean)
        .map(l => {
          const lv = JSON.parse(l);
          enforceLevel(lv);
          return lv;
        });
      sel = levels.length > 0 ? 0 : -1;
      fileName = TRIALS_FILENAME;
      console.log(`Auto-loaded ${levels.length} levels from ${TRIALS_FILENAME}`);
    }
  } catch (e) {
    console.log(`No ${TRIALS_FILENAME} found, starting empty.`, e);
  }
  renderAll();
})();
</script>
