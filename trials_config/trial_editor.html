<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Level Configuration Editor</title>
<style>
  :root {
    --bg: #1e1e2e;
    --surface: #2a2a3d;
    --surface2: #33334a;
    --border: #44446a;
    --text: #e0e0f0;
    --text-dim: #8888aa;
    --accent: #7c6ff7;
    --accent-dim: #5a50b0;
    --danger: #e05555;
    --success: #55cc88;
    --chain-a: #4a8fd4;
    --chain-b: #d4884a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Toolbar ── */
  #toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  #toolbar button, #toolbar label {
    padding: 6px 14px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface2);
    color: var(--text);
    cursor: pointer;
    font-size: 13px;
    transition: background .15s;
  }
  #toolbar button:hover, #toolbar label:hover { background: var(--accent-dim); }
  #toolbar .spacer { flex: 1; }
  #toolbar .title { font-weight: 700; font-size: 15px; color: var(--accent); }
  #toolbar .file-name { font-size: 13px; color: var(--muted, #9aa); }
  #fileInput { display: none; }

  /* ── Layout ── */
  #main { display: flex; flex: 1; overflow: hidden; }

  /* ── Left panel ── */
  #leftPanel {
    width: 200px;
    min-width: 160px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .panel-header {
    padding: 10px 12px;
    font-weight: 600;
    font-size: 12px;
    color: var(--text-dim);
    border-bottom: 1px solid var(--border);
    text-transform: uppercase;
    letter-spacing: .5px;
    flex-shrink: 0;
  }
  #levelList { flex: 1; overflow-y: auto; padding: 6px; }
  .lv-item {
    display: flex;
    align-items: center;
    padding: 7px 8px;
    border-radius: 6px;
    border: 2px solid transparent;
    cursor: pointer;
    margin-bottom: 4px;
    background: var(--surface2);
    transition: border-color .15s;
    user-select: none;
    font-size: 13px;
  }
  .lv-item:hover { background: #3a3a55; }
  .lv-item.selected { border-color: var(--accent); }
  .lv-item .lv-name { flex: 1; font-weight: 600; }
  .lv-item .lv-meta { font-size: 11px; color: var(--text-dim); margin-right: 4px; }
  /* ── Level List Buttons ── */
  .lv-btns { display: flex; gap: 2px; }
  .lv-btn {
    background: none; border: none; color: var(--text-dim);
    cursor: pointer; font-size: 13px; padding: 2px 4px;
    border-radius: 4px; line-height: 1; transition: color .15s, background .15s;
  }
  .lv-btn:hover { background: var(--surface); color: var(--text); }
  .lv-btn.lv-del:hover { color: var(--danger); }
  .empty-list { color: var(--text-dim); font-size: 12px; padding: 12px; text-align: center; }

  /* ── Object Control Buttons ── */
  .obj-ctrl-btns { display: flex; gap: 4px; margin-left: 8px; padding-left: 8px; border-left: 1px solid var(--border); }
  .obj-ctrl-btns button {
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text-dim); cursor: pointer; font-size: 12px;
    padding: 2px 6px; border-radius: 4px; transition: background .15s;
  }
  .obj-ctrl-btns button:hover { background: var(--accent-dim); color: var(--text); }
  .obj-ctrl-btns .obj-del:hover { background: rgba(224,85,85,.2); color: var(--danger); }


  /* ── Editor panel ── */
  #editorPanel { flex: 1; overflow-y: auto; padding: 16px 20px; }
  #placeholder {
    flex: 1; display: flex; align-items: center; justify-content: center;
    color: var(--text-dim); font-size: 15px;
  }

  /* ── Sections ── */
  .sec-title {
    font-size: 12px; font-weight: 700; color: var(--accent);
    text-transform: uppercase; letter-spacing: .5px;
    padding-bottom: 6px; margin-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }
  .section { margin-bottom: 24px; }

  /* ── Chains grid ── */
  .chains-grid { 
    display: flex; 
    flex-direction: column; 
    gap: 14px; 
  }
  /* ── Object add/remove buttons ── */
  .obj-actions { display: flex; gap: 6px; margin-left: auto; }
  .obj-actions button {
    padding: 3px 10px; border: 1px solid var(--border); border-radius: 5px;
    background: var(--surface2); color: var(--text-dim); cursor: pointer;
    font-size: 12px; transition: background .15s;
  }
  .obj-actions button:hover { background: var(--accent-dim); color: var(--text); }
  .obj-actions .remove-obj:hover { background: rgba(224,85,85,.2); color: var(--danger); }

  /* ── Target door selector ── */
  .target-door-wrap { display: flex; align-items: center; gap: 4px; margin-left: auto; }
  .target-door-wrap select { font-size: 11px; padding: 2px 6px; }
  .target-door-wrap input[type=number] { width: 40px; font-size: 11px; padding: 2px 4px; }

  /* ── Object card ── */
  .obj-card {
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .obj-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    font-weight: 700;
    font-size: 13px;
  }
  .obj-header label { font-size: 12px; color: var(--text-dim); margin-left: auto; }
  .obj-header input[type=number] {
    width: 48px; padding: 3px 5px; font-size: 12px;
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); border-radius: 4px;
  }

  /* ── Read-only span for computed values ── */
  .readonly-val {
    font-size: 11px; color: var(--text); background: var(--surface2);
    border: 1px solid var(--border); border-radius: 4px;
    padding: 3px 6px; font-family: monospace;
  }

  /* ── Face table ── */
  .face-table-wrap { overflow-x: auto; }
  .face-table {
    width: 100%; border-collapse: collapse; font-size: 11px;
  }
  .face-table th {
    padding: 5px 6px; text-align: left; color: var(--text-dim);
    border-bottom: 1px solid var(--border);
    white-space: nowrap; font-weight: 600; font-size: 10px;
    text-transform: uppercase; letter-spacing: .3px;
  }
  .face-table td {
    padding: 5px 6px; vertical-align: middle;
    border-bottom: 1px solid var(--border);
  }
  .face-table tr:last-child td { border-bottom: none; }
  .face-badge {
    display: inline-block; width: 22px; height: 22px; border-radius: 50%;
    line-height: 22px; text-align: center;
    font-size: 10px; font-weight: 700; color: #fff;
    background: var(--border);
  }
  .face-badge.f0 { background: #555577; }
  .face-badge.f1 { background: #557755; }
  .face-badge.f2 { background: #775555; }

  /* ── Face constraint badges ── */
  .face-label-wrap { display: flex; flex-direction: column; gap: 2px; align-items: flex-start; }
  .face-shared-badge {
    font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .3px;
    color: var(--accent); background: rgba(124,111,247,0.15);
    padding: 1px 4px; border-radius: 3px; white-space: nowrap;
  }
  .face-mirror-badge {
    font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .3px;
    color: var(--success); background: rgba(85,204,136,0.15);
    padding: 1px 4px; border-radius: 3px; white-space: nowrap;
  }

  /* ── Locked face row ── */
  tr.face-locked td { background: rgba(0,0,0,0.18); opacity: 0.65; }
  tr.face-locked input, tr.face-locked select, tr.face-locked button {
    pointer-events: none;
  }

  /* ── Inputs ── */
  input[type=number], select {
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); border-radius: 4px; padding: 3px 5px;
    font-size: 12px;
  }
  input[type=number]:focus, select:focus {
    outline: none; border-color: var(--accent);
  }
  .num-sm { width: 56px; }
  .num-xs { width: 44px; }
  .tex-wrap { display: flex; align-items: center; gap: 4px; width: 100%; }
  .tex-picker-btn {
    flex: 1; min-width: 0;
    display: flex; align-items: center; justify-content: space-between; gap: 5px;
    padding: 3px 6px;
    border: 1px solid var(--border); border-radius: 4px;
    background: var(--surface2); color: var(--text);
    font: inherit; font-size: 11px; cursor: pointer;
  }
  .tex-picker-btn:hover, .tex-picker-btn[aria-expanded=true] { border-color: var(--accent); }
  .tex-picker-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .texture-popover {
    position: fixed; z-index: 1000;
    width: min(330px, calc(100vw - 20px));
    padding: 8px;
    border: 1px solid var(--accent); border-radius: 8px;
    background: #242437;
    box-shadow: 0 12px 35px rgba(0,0,0,.55);
  }
  .texture-popover[hidden] { display: none; }
  .texture-hover-preview {
    --hover-image: none; --hover-tint: #fff; --hover-opacity: 1;
    position: relative;
    height: 132px;
    display: flex; align-items: flex-end;
    padding: 8px;
    overflow: hidden;
    border-radius: 6px;
    background-color: #ddd;
    background-image:
      linear-gradient(45deg, #aaa 25%, transparent 25%),
      linear-gradient(-45deg, #aaa 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #aaa 75%),
      linear-gradient(-45deg, transparent 75%, #aaa 75%);
    background-size: 20px 20px;
    background-position: 0 0, 0 10px, 10px -10px, -10px 0;
    color: #fff; font-size: 11px; font-weight: 700;
    text-shadow: 0 1px 3px #000;
  }
  .texture-hover-preview::before {
    content: "";
    position: absolute; inset: 0;
    background-color: var(--hover-tint);
    background-image: var(--hover-image);
    background-blend-mode: multiply;
    background-position: center;
    background-size: cover;
    opacity: var(--hover-opacity);
  }
  .texture-hover-preview::after {
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,.72), transparent 62%);
    pointer-events: none;
  }
  .texture-hover-preview > span { position: relative; z-index: 1; }
  .texture-choice-list {
    max-height: 245px; margin-top: 7px; overflow-y: auto;
    display: flex; flex-direction: column; gap: 2px;
  }
  .texture-choice {
    width: 100%; padding: 5px 7px;
    border: 0; border-radius: 4px;
    background: transparent; color: var(--text);
    text-align: left; font-size: 11px; cursor: pointer;
  }
  .texture-choice:hover, .texture-choice:focus { outline: none; background: var(--accent-dim); }
  .texture-choice.active { color: #fff; background: var(--accent); }
  .tex-cube {
    --tex-preview: none;
    position: relative; width: 30px; height: 30px; flex: 0 0 30px;
    filter: drop-shadow(0 2px 2px rgba(0,0,0,.45));
  }
  .tex-cube-face {
    position: absolute; inset: 0;
    overflow: hidden;
    background-color: #ddd;
    background-image:
      linear-gradient(45deg, #aaa 25%, transparent 25%),
      linear-gradient(-45deg, #aaa 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #aaa 75%),
      linear-gradient(-45deg, transparent 75%, #aaa 75%);
    background-size: 8px 8px;
    background-position: 0 0, 0 4px, 4px -4px, -4px 0;
  }
  .tex-cube-face::before {
    content: ""; position: absolute; inset: 0;
    background-color: var(--tex-tint, #fff);
    background-image: var(--tex-preview);
    background-blend-mode: multiply;
    background-size: cover;
    background-position: center;
    opacity: var(--tex-opacity, 1);
  }
  .tex-cube-top {
    clip-path: polygon(50% 0, 100% 25%, 50% 50%, 0 25%);
    filter: brightness(1.18);
  }
  .tex-cube-left {
    clip-path: polygon(0 25%, 50% 50%, 50% 100%, 0 75%);
    filter: brightness(.72);
  }
  .tex-cube-right {
    clip-path: polygon(50% 50%, 100% 25%, 100% 75%, 50% 100%);
    filter: brightness(.92);
  }
  .tex-cube::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(30deg, transparent 48%, rgba(255,255,255,.24) 50%, transparent 52%);
    clip-path: polygon(49% 49%, 51% 49%, 51% 100%, 49% 100%);
  }

  /* ── Per-object approximate 3D previews ── */
  .approx-preview-grid {
    margin-top: 12px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 12px;
  }
  .approx-preview-card {
    --scene-background-image: none;
    --scene-background-tint: #fff;
    --scene-platform-image: none;
    --scene-platform-tint: #fff;
    --wood-image: none;
    --lid-image: none;
    position: relative;
    height: 310px;
    overflow: hidden;
    border: 1px solid var(--border);
    border-radius: 10px;
    background-color: var(--scene-background-tint);
    background-image:
      linear-gradient(to bottom, rgba(12,12,24,.08), rgba(12,12,24,.55)),
      var(--scene-background-image);
    background-blend-mode: normal, multiply;
    background-position: center, center;
    background-size: auto, 145px 145px;
    background-repeat: no-repeat, repeat;
    isolation: isolate;
  }
  .approx-preview-card::after {
    content: "";
    position: absolute; inset: 0;
    z-index: 5;
    pointer-events: none;
    box-shadow: inset 0 0 48px rgba(0,0,0,.45);
  }
  .preview-caption {
    position: absolute; top: 9px; left: 11px; z-index: 6;
    padding: 3px 7px;
    border-radius: 4px;
    background: rgba(20,20,32,.72);
    color: rgba(255,255,255,.84);
    font-size: 10px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .45px;
    backdrop-filter: blur(3px);
  }
  .preview-interaction-status {
    position: absolute; top: 9px; right: 11px; z-index: 6;
    padding: 3px 7px;
    border-radius: 4px;
    background: rgba(20,20,32,.72);
    color: rgba(255,255,255,.72);
    font-size: 9px; font-weight: 600;
    pointer-events: none;
    backdrop-filter: blur(3px);
  }
  .preview-platform {
    position: absolute;
    z-index: 0;
    left: -15%; right: -15%; bottom: -37%; height: 68%;
    background-color: var(--scene-platform-tint);
    background-image: var(--scene-platform-image);
    background-blend-mode: multiply;
    background-position: center;
    background-size: 105px 105px;
    background-repeat: repeat;
    transform: perspective(420px) rotateX(58deg);
    transform-origin: center top;
    box-shadow: 0 -12px 28px rgba(0,0,0,.2);
  }
  .preview-scene {
    position: absolute; inset: 30px 0 0;
    z-index: 2;
    perspective: 700px;
    touch-action: none;
    cursor: grab;
    user-select: none;
  }
  .preview-scene.is-dragging { cursor: grabbing; }
  .preview-drag-rotator {
    --drag-x: -18deg;
    --drag-y: -18deg;
    position: absolute;
    left: 50%; top: 16px;
    width: 224px; height: 244px;
    transform: translateX(-50%) rotateX(var(--drag-x)) rotateY(var(--drag-y));
    transform-style: preserve-3d;
  }
  .preview-auto-rotator {
    position: absolute; inset: 0;
    transform-style: preserve-3d;
    animation: approximate-preview-spin 10s linear infinite;
    animation-delay: calc(var(--preview-index, 0) * -1.15s);
    will-change: transform;
  }
  .preview-scene.is-dragging .preview-auto-rotator,
  .approx-preview-card.preview-paused .preview-auto-rotator { animation-play-state: paused; }
  .preview-model { position: absolute; inset: 0; transform-style: preserve-3d; }
  .preview-prism {
    position: absolute;
    left: 50%; top: 19px;
    width: 108px; height: 108px;
    transform: translateX(-50%);
    transform-style: preserve-3d;
  }
  .preview-prism-face {
    --face-image: none;
    --face-tint: #fff;
    position: absolute;
    inset: 0;
    overflow: hidden;
    backface-visibility: hidden;
    background-color: var(--face-tint);
    background-image:
      linear-gradient(105deg, rgba(255,255,255,.24), transparent 43%, rgba(0,0,0,.24)),
      var(--face-image);
    background-blend-mode: soft-light, multiply;
    background-size: cover;
    background-position: center;
    opacity: var(--face-opacity, 1);
    border: 1px solid rgba(255,255,255,.12);
    box-shadow: inset 0 0 12px rgba(0,0,0,.18);
  }
  .preview-prism-face:nth-child(1) { transform: rotateY(0deg) translateZ(31px); }
  .preview-prism-face:nth-child(2) { transform: rotateY(120deg) translateZ(31px); filter: brightness(.84); }
  .preview-prism-face:nth-child(3) { transform: rotateY(240deg) translateZ(31px); filter: brightness(.68); }
  .preview-top-lid {
    position: absolute;
    left: 50%; top: -47px;
    width: 108px; height: 94px;
    transform: translateX(-50%) translateZ(-15.5px) rotateX(90deg);
    clip-path: polygon(50% 0, 100% 100%, 0 100%);
    background-color: #fff;
    background-image:
      linear-gradient(105deg, rgba(255,255,255,.2), transparent 48%, rgba(0,0,0,.18)),
      var(--lid-image);
    background-blend-mode: soft-light, multiply;
    background-position: center;
    background-size: cover;
    border: 1px solid rgba(255,255,255,.18);
    opacity: 1;
  }
  .preview-wood-base {
    position: absolute;
    left: 50%; top: 127px;
    width: 250px; height: 250px;
    transform: translate(-50%, -50%) rotateX(90deg);
    transform-style: preserve-3d;
  }
  .preview-wood-base-bottom,
  .preview-wood-base-top {
    position: absolute; inset: 0;
    /* Regular hexagon. Its alternating side centres line up with the three
       prism-face normals, matching create_top_lid_mesh() in the game. */
    clip-path: polygon(100% 50%, 75% 93.301%, 25% 93.301%, 0 50%, 25% 6.699%, 75% 6.699%);
    background-color: #8b6747;
    background-image: var(--wood-image);
    background-blend-mode: multiply;
    background-position: center;
    background-size: 92px 92px;
  }
  .preview-wood-base-bottom { transform: translateZ(-8px); filter: brightness(.45); }
  .preview-wood-base-top {
    transform: translateZ(1px);
    box-shadow: inset 0 0 13px rgba(0,0,0,.32);
    filter: drop-shadow(0 9px 7px rgba(0,0,0,.42));
  }
  .preview-reward-marker {
    position: absolute;
    left: 50%; top: 131px;
    width: 20px; height: 20px;
    transform:
      translate(-50%, -50%)
      rotateY(var(--reward-rotation))
      translateZ(108.25px);
    clip-path: polygon(50% 0, 97.55% 34.55%, 79.39% 90.45%, 20.61% 90.45%, 2.45% 34.55%);
    backface-visibility: hidden;
    background: #ffcc00;
    border: 1px solid rgba(255,255,255,.85);
    box-shadow:
      inset 0 0 5px rgba(255,255,255,.75),
      0 0 8px 2px rgba(255,204,0,.85);
  }
  .preview-reward-marker::after {
    content: "";
    position: absolute; inset: 4px;
    border-radius: 50%;
    background: rgba(255,255,255,.72);
  }
  .preview-face-label {
    position: absolute;
    left: 50%; bottom: 5px;
    transform: translateX(-50%);
    padding: 1px 4px;
    border-radius: 3px;
    background: rgba(0,0,0,.45);
    color: rgba(255,255,255,.88);
    font-size: 8px; font-weight: 800;
  }
  .preview-decorations {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .preview-decoration {
    --decoration-image: none;
    --decoration-tint: #fff;
    position: absolute;
    width: 1.25em;
    overflow: hidden;
    color: var(--decoration-tint);
    background-color: var(--decoration-tint);
    background-image: var(--decoration-image);
    background-blend-mode: multiply;
    background-position: center;
    background-size: cover;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    font-size: var(--decoration-size, 13px);
    line-height: 1;
    text-align: center;
    transform: translate(-50%, -50%) rotate(var(--decoration-rotation, 0deg));
    opacity: var(--decoration-opacity, 1);
    filter: drop-shadow(0 1px 1px rgba(0,0,0,.5));
  }
  @keyframes approximate-preview-spin {
    from { transform: rotateY(0deg); }
    to { transform: rotateY(360deg); }
  }

  @media (prefers-reduced-motion: reduce) {
    .preview-auto-rotator { animation: none; transform: rotateY(25deg); }
  }

  /* ── Color input ── */
  .color-wrap { display: flex; align-items: center; gap: 3px; }
  input[type=color] {
    width: 28px; height: 22px; padding: 1px; border-radius: 3px;
    border: 1px solid var(--border); background: var(--surface2); cursor: pointer;
  }
  .alpha-in { width: 38px; }

  /* ── Rotation widget ── */
  .rot-wrap { display: flex; align-items: center; gap: 3px; }
  .rot-rand-btn {
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text-dim); cursor: pointer; font-size: 10px;
    padding: 2px 5px; border-radius: 4px; font-weight: 600;
  }
  .rot-rand-btn:hover { background: var(--accent-dim); color: var(--text); }
  .rot-rand-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .rot-deg-in:disabled { opacity: 0.35; }

  /* ── Shape buttons ── */
  .shape-btns { display: flex; gap: 2px; }
  .shape-btn {
    width: 22px; height: 22px; border-radius: 4px; border: 1px solid var(--border);
    background: var(--surface2); color: var(--text-dim); cursor: pointer;
    font-size: 11px; line-height: 1; display: flex; align-items: center; justify-content: center;
    transition: background .1s;
  }

<script type="module">
// ================================================================
// Constants — loaded from the shared Rust library (single source of truth)
// ================================================================
// editor_constants() and controller_constants() come from
// shared/src/web.rs via wasm-bindgen. Same source as controller_main.js,
// so renaming a Texture variant in Rust automatically updates the editor.
//
// Texture previews load from lightweight 128px WebP files in each bevy_ready/ folder.
// Serve over HTTP for previews to work:  python -m http.server 8000

import init, {
  editor_constants,
  controller_constants,
} from "../game_node/pkg/game_node.js?v=20260824-color-mask";

// Populated on init() — used throughout the editor.
let TEXTURES = null;          // enum Texture variants, by repr
let SHAPES = null;            // enum DecorationShape variants, by repr
let N_FACES = null;           // pyramid faces (= chains per object)
let N_DOORS = null;           // = N_FACES * 2 (hexagonal base)
let FACE_INDICES = null;      // [0, 1, …, N_FACES - 1]
let START_ORIENTS = null;
let PYRAMID_DEFAULTS = null;  // base_radius, height, fade-out/in/stay, colors, etc.
let CAMERA_DEFAULTS = null;   // initial_radius, default_y, speed_rotate, rotation_sense
let LIGHTING_DEFAULTS = null; // spotlight/ambient intensities
let GAME_DEFAULTS = null;     // cosine_alignment_to_win, decorations_seeds
let SCENE_DEFAULTS = null;    // sound effects volume, fog + firefly config
let EDITOR_FACE_TEX_IDX = 0;        // default face texture index (resolved by name)
let EDITOR_DECORATION_TEX_IDX = 0;  // default decoration texture index (resolved by name)

// Editor starting textures, resolved against TEXTURES at init. If a texture
// is renamed/removed in Rust, the lookup falls back to 0 and warns.
const EDITOR_DEFAULT_FACE_TEXTURE_NAME = "WoodFloor057_1K";
const EDITOR_DEFAULT_DECORATION_TEXTURE_NAME = "PavingStones146_1K";

// Editor-only display glyphs — no Rust equivalent. Order must mirror SHAPES.
const SHAPE_ICONS = ["●", "■", "★", "▲", "▭", "⬭", "⬠", "◆", "◇", "⏢", "◖"];

// Relative path from this HTML file to texture assets
const TEXTURE_ASSET_BASE = "../game_node/assets/textures";

// Default trials file — fetched at startup, used as the export filename
// until the user imports a differently-named .jsonl.
const TRIALS_FILENAME = "trials.jsonl";

// ================================================================
// Defaults — derived from Rust constants where one exists; remaining
// values (uniform 20/0.2/0.05 per face etc.) are editor-UX choices.
// ================================================================
// Editor convention: object 0 → "type1" (door 2), object 1 → "type2" (door 5).
// These door indices are an editor concept, not a game constant.
const EDITOR_TYPE1_DOOR = 2;
const EDITOR_TYPE2_DOOR = 5;

// Editor UX starting values for a per-face slot. Game invariants come from
// Rust; everything in this block is an editor-only convenience default.
const EDITOR_DEFAULT_FACE_COLOR = [0.5, 0.5, 0.5, 1];
const EDITOR_DEFAULT_DECORATION_COUNT = 20;
const EDITOR_DEFAULT_DECORATION_SIZE = 0.2;
const EDITOR_DEFAULT_DECORATION_THICKNESS = 0.05;
const EDITOR_DEFAULT_DECORATION_SHAPE = 0;     // index into SHAPES (Circle)
const EDITOR_DEFAULT_DECORATION_ROTATION = 0;  // 0 = fixed, -1 = random

function repeat(value, n) {
  return Array.from({ length: n }, () => (Array.isArray(value) ? value.slice() : value));
}

function defaultObject(chainIdx) {
  return {
    _type: chainIdx === 0 ? 'type1' : 'type2',
    target_door: chainIdx === 0 ? EDITOR_TYPE1_DOOR : EDITOR_TYPE2_DOOR,
    // Neutral starting palette so the user customises rather than inheriting
    // the game's red/green/blue defaults from PYRAMID_COLORS. Face 0 stays
    // dark so the "shared" face stands out from the mirrors.
    colors: [[0,0,0,1], ...repeat(EDITOR_DEFAULT_FACE_COLOR, N_FACES - 1)],
    textures: repeat(EDITOR_FACE_TEX_IDX, N_FACES),
    decorations_seeds: Array.from(GAME_DEFAULTS.decorations_seeds),
    decorations_count: repeat(EDITOR_DEFAULT_DECORATION_COUNT, N_FACES),
    decorations_size: repeat(EDITOR_DEFAULT_DECORATION_SIZE, N_FACES),
    decorations_thickness: repeat(EDITOR_DEFAULT_DECORATION_THICKNESS, N_FACES),
    decorations_texture: repeat(EDITOR_DECORATION_TEX_IDX, N_FACES),
    decorations_shape: repeat(EDITOR_DEFAULT_DECORATION_SHAPE, N_FACES),
    decorations_color: PYRAMID_DEFAULTS.decorations_color.map(c => Array.from(c)),
    // Per-face rotation in degrees. -1 = random rotation per decoration.
    // Multiples of 360 = "no rotation" (treated identically to 0).
    decorations_rotation: repeat(EDITOR_DEFAULT_DECORATION_ROTATION, N_FACES),
  };
}

function defaultTrial() {
  return {
    nr_attempts_to_win: 3,
    nr_attempts_suggestion: 3,
    nr_attempts_to_retroceed: 10,
    elapsed_time_to_win: 4.0,
    elapsed_time_to_retroceed: 10.0,
    show_all: false,
  };
}

function defaultLevel(nObjects = 2) {
  const objs = [];
  for (let i = 0; i < nObjects; i++) objs.push(defaultObject(i));
  const lv = {
    objects: objs,
    trials: [defaultTrial()],
    fixed: {
      // Sentinel: the controller always overrides start_orient with a random
      // choice from START_ORIENTS, so the value stored here is never used.
      // Keeping it -1 makes that obvious in saved JSONL files.
      start_orient: -1,
      start_trial: 0,
      // -1 = controller picks at random; otherwise object index 0..N-1.
      start_object: -1,
      // If true, completed objects are dropped from the shuffle bag at refill.
      remove_completed_chains: false,
      // -1 = controller draws a fresh entropy seed at level start (and logs
      // the resolved value); any other int → that exact seed.
      random_seed: -1,
      // Legacy key: only 0 (hide) versus non-zero (show) is used now.
      // The visible control is therefore a Show/Hide selector.
      score_bar_max: 1,
      shake_amplitude: 0.5,
      shake_duration: 1.0,
      sound_effects_volume: SCENE_DEFAULTS.sound_effects_volume,
      background_music_volume: SCENE_DEFAULTS.background_music_volume,
      fog_enabled: SCENE_DEFAULTS.fog_enabled,
      fog_thickness_base: SCENE_DEFAULTS.fog_thickness_base,
      firefly_count: SCENE_DEFAULTS.firefly_count,
      firefly_size: SCENE_DEFAULTS.firefly_size,
      firefly_expand_secs: SCENE_DEFAULTS.firefly_expand_secs,
      platform_texture: SCENE_DEFAULTS.platform_texture,
      platform_color_mask: [0, 0, 0, 0],
      background_texture: SCENE_DEFAULTS.background_texture,
      background_color_mask: [0, 0, 0, 0],
      base_radius: PYRAMID_DEFAULTS.base_radius,
      height: PYRAMID_DEFAULTS.height,
      cosine_alignment_threshold: GAME_DEFAULTS.cosine_alignment_to_win,
      door_anim_fade_out: PYRAMID_DEFAULTS.door_anim_fade_out,
      door_anim_stay_open: PYRAMID_DEFAULTS.door_anim_stay_open,
      door_anim_fade_in: PYRAMID_DEFAULTS.door_anim_fade_in,
      main_spotlight_intensity: LIGHTING_DEFAULTS.spotlight_intensity,
      ambient_brightness: LIGHTING_DEFAULTS.ambient_intensity,
      max_spotlight_intensity: LIGHTING_DEFAULTS.max_spotlight_intensity,
      camera_radius: CAMERA_DEFAULTS.initial_radius,
      camera_y: CAMERA_DEFAULTS.default_y,
      camera_speed_rotate: CAMERA_DEFAULTS.speed_rotate,
      camera_rotation_sense: CAMERA_DEFAULTS.rotation_sense,
    },
  };
  enforceLevel(lv);
  return lv;
}

// ================================================================
// State
// ================================================================
let levels = [];
let sel = -1;
let fileName = TRIALS_FILENAME;
/** Set the file being edited (also the Export download name) and show it in
 *  the toolbar, with `source` explaining where it came from. */
function setFileName(name, source) {
  fileName = name;
  const el = document.getElementById('fileNameLabel');
  if (el) { el.textContent = name; el.title = source || ''; }
}

// ================================================================
// Constraint enforcement
// ================================================================

// Copy all per-face fields from srcObj[srcFi] → dstObj[dstFi]
const FACE_FIELDS = [
  'colors', 'textures', 'decorations_seeds', 'decorations_count',
  'decorations_size', 'decorations_thickness', 'decorations_texture',
  'decorations_shape', 'decorations_color', 'decorations_rotation',
];

function copyFace(srcObj, dstObj, srcFi, dstFi) {
  for (const field of FACE_FIELDS) {
    dstObj[field][dstFi] = deepClone(srcObj[field][srcFi]);
  }
}

// Apply all constraints for a level:
//   Type 1 (chain A) face 0 → Type 2 (chain B) face 0  (shared central face)
//   Type 2 (chain B) face 1 → Type 2 (chain B) face 2  (mirror non-shared faces)
function enforceLevel(lv) {
  if (!lv.objects || lv.objects.length < 1) return;
  const f = lv.fixed;
  if (f.start_trial == null) f.start_trial = 0;
  // start_orient is overridden at runtime; force the stored value to the -1
  // sentinel on import so old files don't look like the editor controls it.
  f.start_orient = -1;
  if (f.camera_radius == null) f.camera_radius = CAMERA_DEFAULTS.initial_radius;
  if (f.camera_y == null) f.camera_y = CAMERA_DEFAULTS.default_y;
  if (f.camera_speed_rotate == null) f.camera_speed_rotate = CAMERA_DEFAULTS.speed_rotate;
  if (f.camera_rotation_sense == null) f.camera_rotation_sense = CAMERA_DEFAULTS.rotation_sense;
  f.camera_radius = Math.max(0.1, Number(f.camera_radius) || CAMERA_DEFAULTS.initial_radius);
  f.camera_y = Number.isFinite(Number(f.camera_y)) ? Number(f.camera_y) : CAMERA_DEFAULTS.default_y;
  f.camera_speed_rotate = Math.max(0, Number(f.camera_speed_rotate) || 0);
  f.camera_rotation_sense = Number(f.camera_rotation_sense) === -1 ? -1 : 1;
  delete f.pr_switching_chain;
  // Retired UI flag. The bottom trial-progress bar is controlled by
  // score_bar_max, and the top row always shows level progress.
  delete f.show_progress_bar;
  if (f.start_object == null) f.start_object = -1;
  f.start_object = Math.trunc(Number(f.start_object));
  if (!Number.isFinite(f.start_object) || f.start_object < 0) f.start_object = -1;
  else f.start_object = Math.min(f.start_object, lv.objects.length - 1);
  if (f.remove_completed_chains == null) f.remove_completed_chains = false;
  f.remove_completed_chains = !!f.remove_completed_chains;
  if (f.random_seed == null) f.random_seed = -1;
  f.random_seed = Math.trunc(f.random_seed);
  if (!Number.isFinite(f.random_seed)) f.random_seed = -1;
  f.random_seed = f.random_seed < 0 ? -1 : Math.min(f.random_seed, 2147483647);
  if (f.score_bar_max == null) f.score_bar_max = 1;
  f.score_bar_max = Number(f.score_bar_max) === 0 ? 0 : 1;
  if (f.shake_amplitude == null) f.shake_amplitude = 0.5;
  if (f.shake_duration == null) f.shake_duration = 1.0;
  f.shake_amplitude = Math.max(0, f.shake_amplitude);
  f.shake_duration = Math.max(0, f.shake_duration);
  if (f.sound_effects_volume == null) f.sound_effects_volume = SCENE_DEFAULTS.sound_effects_volume;
  f.sound_effects_volume = Math.max(0, f.sound_effects_volume);
  if (f.background_music_volume == null) f.background_music_volume = SCENE_DEFAULTS.background_music_volume;
  f.background_music_volume = Math.max(0, f.background_music_volume);
  if (f.fog_enabled == null) f.fog_enabled = SCENE_DEFAULTS.fog_enabled;
  f.fog_enabled = !!f.fog_enabled;
  if (f.fog_thickness_base == null) f.fog_thickness_base = SCENE_DEFAULTS.fog_thickness_base;
  f.fog_thickness_base = Math.max(0, f.fog_thickness_base);
  if (f.firefly_count == null) f.firefly_count = SCENE_DEFAULTS.firefly_count;
  f.firefly_count = Math.max(0, Math.round(f.firefly_count));
  if (f.firefly_size == null) f.firefly_size = SCENE_DEFAULTS.firefly_size;
  f.firefly_size = Math.max(0, f.firefly_size);
  if (f.firefly_expand_secs == null) f.firefly_expand_secs = SCENE_DEFAULTS.firefly_expand_secs;
  f.firefly_expand_secs = Math.max(0, f.firefly_expand_secs);
  // Backdrops. `*_color_mask` is [r, g, b, a] with a = mask strength; all-zero
  // (the default) leaves the texture untouched, exactly as before the field
  // existed, so older files look unchanged.
  if (f.platform_texture == null) f.platform_texture = SCENE_DEFAULTS.platform_texture;
  if (f.background_texture == null) f.background_texture = SCENE_DEFAULTS.background_texture;
  f.platform_texture = Math.max(0, Math.min(TEXTURES.length - 1, Math.round(f.platform_texture)));
  f.background_texture = Math.max(0, Math.min(TEXTURES.length - 1, Math.round(f.background_texture)));
  if (!Array.isArray(f.platform_color_mask) || f.platform_color_mask.length !== 4) f.platform_color_mask = [0, 0, 0, 0];
  if (!Array.isArray(f.background_color_mask) || f.background_color_mask.length !== 4) f.background_color_mask = [0, 0, 0, 0];
  // Pyramid / animation / lighting — backfill so files saved before these were
  // editable (or hand-written without them) load with sensible defaults instead
  // of rendering `undefined` inputs and exporting them back as missing.
  if (f.base_radius == null) f.base_radius = PYRAMID_DEFAULTS.base_radius;
  if (f.height == null) f.height = PYRAMID_DEFAULTS.height;
  if (f.cosine_alignment_threshold == null) f.cosine_alignment_threshold = GAME_DEFAULTS.cosine_alignment_to_win;
  f.base_radius = Math.max(0.01, Number(f.base_radius) || PYRAMID_DEFAULTS.base_radius);
  f.height = Math.max(0.01, Number(f.height) || PYRAMID_DEFAULTS.height);
  f.cosine_alignment_threshold = Math.max(0, Math.min(1, Number(f.cosine_alignment_threshold) || 0));
  if (f.door_anim_fade_out == null) f.door_anim_fade_out = PYRAMID_DEFAULTS.door_anim_fade_out;
  if (f.door_anim_stay_open == null) f.door_anim_stay_open = PYRAMID_DEFAULTS.door_anim_stay_open;
  if (f.door_anim_fade_in == null) f.door_anim_fade_in = PYRAMID_DEFAULTS.door_anim_fade_in;
  if (f.main_spotlight_intensity == null) f.main_spotlight_intensity = LIGHTING_DEFAULTS.spotlight_intensity;
  if (f.ambient_brightness == null) f.ambient_brightness = LIGHTING_DEFAULTS.ambient_intensity;
  if (f.max_spotlight_intensity == null) f.max_spotlight_intensity = LIGHTING_DEFAULTS.max_spotlight_intensity;
  f.door_anim_fade_out = Math.max(0, Number(f.door_anim_fade_out) || 0);
  f.door_anim_stay_open = Math.max(0, Number(f.door_anim_stay_open) || 0);
  f.door_anim_fade_in = Math.max(0, Number(f.door_anim_fade_in) || 0);
  f.main_spotlight_intensity = Math.max(0, Number(f.main_spotlight_intensity) || 0);
  f.ambient_brightness = Math.max(0, Number(f.ambient_brightness) || 0);
  f.max_spotlight_intensity = Math.max(0, Number(f.max_spotlight_intensity) || 0);
  for (const t of (lv.trials || [])) {
    if (t.nr_attempts_to_win == null) t.nr_attempts_to_win = 3;
    if (t.nr_attempts_suggestion == null) t.nr_attempts_suggestion = 3;
    if (t.nr_attempts_to_retroceed == null) t.nr_attempts_to_retroceed = 10;
    if (t.elapsed_time_to_win == null) t.elapsed_time_to_win = 4.0;
    if (t.elapsed_time_to_retroceed == null) t.elapsed_time_to_retroceed = 10.0;
    if (t.show_all == null) t.show_all = false;
    t.nr_attempts_to_win = Math.max(0, Math.round(Number(t.nr_attempts_to_win) || 0));
    t.nr_attempts_suggestion = Math.max(0, Math.round(Number(t.nr_attempts_suggestion) || 0));
    t.nr_attempts_to_retroceed = Math.max(0, Math.round(Number(t.nr_attempts_to_retroceed) || 0));
    t.elapsed_time_to_win = Math.max(0, Number(t.elapsed_time_to_win) || 0);
    t.elapsed_time_to_retroceed = Math.max(0, Number(t.elapsed_time_to_retroceed) || 0);
    t.show_all = !!t.show_all;
  }
  f.start_trial = Math.max(0, Math.min(Math.round(Number(f.start_trial) || 0), Math.max(0, lv.trials.length - 1)));

  let firstSharedIdx = -1;
  for (let i = 0; i < lv.objects.length; i++) {
    const obj = lv.objects[i];

    // Backfill per-face fields added in later schema versions.
    if (!Array.isArray(obj.decorations_rotation)) {
      obj.decorations_rotation = repeat(EDITOR_DEFAULT_DECORATION_ROTATION, N_FACES);
    }
    obj.target_door = Math.max(0, Math.min(N_DOORS - 1, Math.round(Number(obj.target_door) || 0)));
    for (const fi of FACE_INDICES) {
      obj.textures[fi] = Math.max(0, Math.min(TEXTURES.length - 1, Math.round(Number(obj.textures[fi]) || 0)));
      obj.decorations_texture[fi] = Math.max(0, Math.min(TEXTURES.length - 1, Math.round(Number(obj.decorations_texture[fi]) || 0)));
      obj.decorations_seeds[fi] = Math.min(Number.MAX_SAFE_INTEGER, Math.max(0, Math.round(Number(obj.decorations_seeds[fi]) || 0)));
      obj.decorations_count[fi] = Math.max(0, Math.round(Number(obj.decorations_count[fi]) || 0));
      obj.decorations_size[fi] = Math.max(0, Number(obj.decorations_size[fi]) || 0);
      obj.decorations_thickness[fi] = Math.max(0, Number(obj.decorations_thickness[fi]) || 0);
      obj.decorations_shape[fi] = Math.max(0, Math.min(SHAPES.length - 1, Math.round(Number(obj.decorations_shape[fi]) || 0)));
      const rotation = Math.round(Number(obj.decorations_rotation[fi]) || 0);
      obj.decorations_rotation[fi] = rotation < 0 ? -1 : rotation % 360;
    }

    // _type is now persisted in the JSONL. For older files without it, fall
    // back to inferring from `target_door`. This used to clobber custom
    // objects whose door happened to be 2 or 5 — now the inference only
    // runs when `_type` is genuinely missing.
    if (!obj._type) {
      const td = obj.target_door;
      obj._type = td === EDITOR_TYPE1_DOOR ? 'type1' : (td === EDITOR_TYPE2_DOOR ? 'type2' : 'custom');
    }

    // Find master shared object
    if (obj._type === 'type1' || obj._type === 'type2') {
      if (firstSharedIdx === -1) firstSharedIdx = i;
    }
  }

  for (let i = 0; i < lv.objects.length; i++) {
    const isType2 = lv.objects[i]._type === 'type2';
    const isCustom = lv.objects[i]._type === 'custom';

    if (!isCustom) {
      if (firstSharedIdx !== -1 && i !== firstSharedIdx) {
        copyFace(lv.objects[firstSharedIdx], lv.objects[i], 0, 0);
      }
      if (isType2) {
        copyFace(lv.objects[i], lv.objects[i], 1, 2);
      }
    }
  }
}

// Helper: Broadcasts Face 0 to all other shared objects
function pushFace0ToShared(sourceCi) {
  const lv = levels[sel];
  const srcObj = lv.objects[sourceCi];
  for (let i = 0; i < lv.objects.length; i++) {
    if (i === sourceCi) continue;
    const isOtherCustom = lv.objects[i].target_door !== EDITOR_TYPE1_DOOR && lv.objects[i].target_door !== EDITOR_TYPE2_DOOR;
    if (!isOtherCustom) {
      copyFace(srcObj, lv.objects[i], 0, 0);
    }
  }
}

/**
 * Maps the 6 hexagonal doors to a triangular footprint:
 * Door 5: Top Vertex (Over Face 0)
 * Door 0: Right Edge (Between Face 0 and 1)
 * Door 1: Bottom-Right Vertex
 * Door 2: Bottom Edge
 * Door 3: Bottom-Left Vertex
 * Door 4: Left Edge
 */
function getDoorStyle(doorIdx) {
  const coords = [
    { x: '18px',  y: '26px' },   // Door 0 (Bottom-Right Vertex)
    { x: '9px',   y: '15px' },   // Door 1 (Mid-Right Edge)
    { x: '0px',   y: '0px' },    // Door 2 (Top Vertex)
    { x: '-9px',  y: '15px' },   // Door 3 (Mid-Left Edge)
    { x: '-18px', y: '26px' },   // Door 4 (Bottom-Left Vertex)
    { x: '0px',   y: '26px' },   // Door 5 (Bottom-Mid Edge)
  ];
  const pos = coords[doorIdx] || { x: '0px', y: '15px' };
  return `left: ${pos.x}; top: ${pos.y};`;
}

const deepClone = x => JSON.parse(JSON.stringify(x));

function toHex(rgba) {
  return '#' + rgba.slice(0, 3)
    .map(v => Math.round(Math.max(0, Math.min(1, v)) * 255).toString(16).padStart(2, '0'))
    .join('');
}

function hexToRgba(hex, a) {
  return [
    parseInt(hex.slice(1, 3), 16) / 255,
    parseInt(hex.slice(3, 5), 16) / 255,
    parseInt(hex.slice(5, 7), 16) / 255,
    Math.max(0, Math.min(1, parseFloat(a) || 0)),
  ];
}

function texThumbUrl(idx, tintable = false) {
  const map = tintable ? 'preview_tintable.webp' : 'preview.webp';
  return `${TEXTURE_ASSET_BASE}/${TEXTURES[idx]}-JPG/bevy_ready/${map}`;
}

function clamp01(value) {
  return Math.max(0, Math.min(1, Number(value) || 0));
}

function rgbCss(rgb) {
  return `rgb(${rgb.slice(0, 3).map(v => Math.round(clamp01(v) * 255)).join(', ')})`;
}

function colorMaskTint(mask) {
  const strength = clamp01(mask?.[3]);
  return rgbCss([0, 1, 2].map(i => 1 + (clamp01(mask?.[i]) - 1) * strength));
}

/** Mirror the material color calculation used by Bevy for this selector.
 *  Alpha is mask strength for every editable color: 0 keeps the source texture
 *  color, while 1 multiplies it fully by the selected RGB. */
function texturePreviewSpec(id, textureIndex) {
  if (id === 'bdPlatformTex' || id === 'bdBackgroundTex') {
    const mask = id === 'bdPlatformTex'
      ? levels[sel].fixed.platform_color_mask
      : levels[sel].fixed.background_color_mask;
    return { url: texThumbUrl(textureIndex), tint: colorMaskTint(mask), opacity: 1 };
  }

  const match = id.match(/^c(\d+)f(\d+)(ft|dt)$/);
  if (match) {
    const object = levels[sel].objects[+match[1]];
    const faceIndex = +match[2];
    const color = match[3] === 'ft'
      ? object.colors[faceIndex]
      : object.decorations_color[faceIndex];
    return {
      url: texThumbUrl(textureIndex, true),
      tint: colorMaskTint(color),
      opacity: 1,
    };
  }

  return { url: texThumbUrl(textureIndex), tint: '#fff', opacity: 1 };
}

function texSelectHtml(id, val) {
  const preview = texturePreviewSpec(id, val);
  return `<span class="tex-wrap">
    <span class="tex-cube" style="--tex-preview:url('${preview.url}');--tex-tint:${preview.tint};--tex-opacity:${preview.opacity}"
          role="img" aria-label="Selected texture: ${TEXTURES[val]}" title="${TEXTURES[val]}">
      <span class="tex-cube-face tex-cube-top"></span>

}

function ensureTexturePickerPopover() {
  if (texturePickerPopover) return texturePickerPopover;
  texturePickerPopover = document.createElement('div');
  texturePickerPopover.className = 'texture-popover';
  texturePickerPopover.hidden = true;
  texturePickerPopover.innerHTML = `
    <div class="texture-hover-preview"><span></span></div>

  });
  texturePickerPopover.addEventListener('focusin', event => {

  });
  texturePickerPopover.addEventListener('click', event => {

  ).join('');

function textureIdForColorId(colorId) {
  if (colorId === 'bdPlatformMask') return 'bdPlatformTex';
  if (colorId === 'bdBackgroundMask') return 'bdBackgroundTex';
  const match = colorId.match(/^(c\d+f\d+)(fc|dc)$/);
  if (!match) return null;
  return `${match[1]}${match[2] === 'fc' ? 'ft' : 'dt'}`;
}

function seededRandom(seed) {
  let state = Math.trunc(Number(seed) || 1) >>> 0;
  return () => {
    state = (state + 0x6d2b79f5) >>> 0;
    let value = state;
    value = Math.imul(value ^ (value >>> 15), value | 1);
    value ^= value + Math.imul(value ^ (value >>> 7), value | 61);
    return ((value ^ (value >>> 14)) >>> 0) / 4294967296;
  };
}

function gridDecorationPoints(count) {
  if (count <= 0) return [];
  if (count === 1) return [{ x: 50, y: 50 }];

  const columns = Math.ceil(Math.sqrt(count));
  const rows = Math.ceil(count / columns);
  const candidates = [];
  for (let row = 0; row < rows; row++) {
    const y = rows === 1 ? 50 : 17 + (row / (rows - 1)) * 66;
    for (let column = 0; column < columns; column++) {
      const x = columns === 1 ? 50 : 15 + (column / (columns - 1)) * 70;
      candidates.push({ x, y });
    }
  }

  // Pick the most widely separated subset when the last square-grid row is
  // incomplete, keeping the preview balanced around the whole face.
  let bestA = 0, bestB = 1, bestDistance = -1;
  for (let a = 0; a < candidates.length; a++) {
    for (let b = a + 1; b < candidates.length; b++) {
      const distance = (candidates[a].x - candidates[b].x) ** 2
        + (candidates[a].y - candidates[b].y) ** 2;
      if (distance > bestDistance) [bestA, bestB, bestDistance] = [a, b, distance];
    }
  }
  const selected = [candidates[bestA], candidates[bestB]];
  const remaining = candidates.filter((_, i) => i !== bestA && i !== bestB);
  while (selected.length < count && remaining.length) {
    let bestIndex = 0, bestNearest = -1;
    remaining.forEach((candidate, index) => {
      const nearest = Math.min(...selected.map(point =>
        (candidate.x - point.x) ** 2 + (candidate.y - point.y) ** 2));
      if (nearest > bestNearest) [bestIndex, bestNearest] = [index, nearest];
    });
    selected.push(remaining.splice(bestIndex, 1)[0]);
  }
  return selected;
}

function randomDecorationPoints(count, seed) {
  if (count <= 0) return [];
  const random = seededRandom(seed);
  const candidates = Array.from({ length: Math.max(60, count * 8) }, () => ({
    x: 14 + random() * 72,
    y: 16 + random() * 68,
  }));
  const centre = { x: 50, y: 50 };
  let first = 0, firstDistance = Infinity;
  candidates.forEach((candidate, index) => {
    const distance = (candidate.x - centre.x) ** 2 + (candidate.y - centre.y) ** 2;
    if (distance < firstDistance) [first, firstDistance] = [index, distance];
  });
  const selected = [candidates.splice(first, 1)[0]];
  while (selected.length < count && candidates.length) {
    let bestIndex = 0, bestNearest = -1;
    candidates.forEach((candidate, index) => {
      const nearest = Math.min(...selected.map(point =>
        (candidate.x - point.x) ** 2 + (candidate.y - point.y) ** 2));
      if (nearest > bestNearest) [bestIndex, bestNearest] = [index, nearest];
    });
    selected.push(candidates.splice(bestIndex, 1)[0]);
  }
  return selected;
}

function renderPreviewDecorations(obj, ci, fi) {
  const configuredCount = Math.max(0, Math.round(Number(obj.decorations_count[fi]) || 0));
  const count = Math.min(30, configuredCount);
  if (!count) return '';
  const spec = texturePreviewSpec(`c${ci}f${fi}dt`, obj.decorations_texture[fi]);
  const glyph = SHAPE_ICONS[obj.decorations_shape[fi]] || SHAPE_ICONS[0];
  const rotation = Number(obj.decorations_rotation[fi]);
  const seed = Math.max(0, Math.trunc(Number(obj.decorations_seeds[fi]) || 0));
  const points = seed === 0
    ? gridDecorationPoints(count)
    : randomDecorationPoints(count, seed);
  const rotationRandom = seededRandom(seed || (ci + 1) * 1009 + fi * 9176);
  const size = Math.max(7, Math.min(25, 7 + (Number(obj.decorations_size[fi]) || 0) * 28));
  const marks = points.map(point => {
    const markRotation = rotation < 0 ? Math.round(rotationRandom() * 360) : (rotation || 0);
    return `<span class="preview-decoration"
      style="left:${point.x.toFixed(1)}%;top:${point.y.toFixed(1)}%;--decoration-size:${size.toFixed(1)}px;--decoration-rotation:${markRotation}deg;--decoration-image:url('${spec.url}');--decoration-tint:${spec.tint};--decoration-opacity:${spec.opacity}">${glyph}</span>`;
  }).join('');
  const sampleNote = configuredCount > count ? `; showing ${count} of ${configuredCount}` : '';
  const layout = seed === 0 ? 'uniform grid' : `seeded random layout ${seed}`;
  return `<span class="preview-decorations" title="${layout}${sampleNote}">${marks}</span>`;
}

function renderPreviewReward(targetDoor) {
  const door = Math.max(0, Math.min(N_DOORS - 1, Math.round(Number(targetDoor) || 0)));
  // spawn_pyramid_base() places door i at the midpoint of the two vertices
  // starting at orientation + 90°. The preview prism includes the game's 30°
  // orientation offset, giving side-centre angles 150°, 210°, …, 90°.
  const doorAngle = door * (360 / N_DOORS) + 150;
  const markerRotation = 90 - doorAngle;
  return `<span class="preview-reward-marker" data-preview-reward-door="${door}"
    style="--reward-rotation:${markerRotation}deg"
    title="Reward target · door ${door}" aria-label="Reward target on door ${door}"></span>`;
}

         tabindex="0" aria-label="Interactive approximate preview for object ${ci}">

function renderLevelObjectPreview(level) {

    ${level.objects.map(renderObjectPreview).join('')}
  </div>`;

const approximatePreviewStates = new Map();

function bindApproximatePreviewInteractions(root = document) {
  root.querySelectorAll('[data-preview-scene]:not([data-preview-bound])').forEach(scene => {
    scene.dataset.previewBound = 'true';
    const card = scene.closest('.approx-preview-card');
    const rotator = scene.querySelector('.preview-drag-rotator');
    const status = card.querySelector('.preview-interaction-status');
    const key = scene.dataset.previewKey;
    const state = approximatePreviewStates.get(key) || { yaw: -18, pitch: -18, paused: false };
    approximatePreviewStates.set(key, state);
    let dragging = false;
    let lastX = 0;
    let lastY = 0;

    const applyState = () => {
      rotator.style.setProperty('--drag-x', `${state.pitch}deg`);
      rotator.style.setProperty('--drag-y', `${state.yaw}deg`);
      card.classList.toggle('preview-paused', state.paused);
      status.textContent = state.paused
        ? 'Paused · double-click to rotate'
        : 'Drag · double-click to pause';
    };
    const togglePaused = () => {
      state.paused = !state.paused;
      applyState();
    };
    const finishDrag = event => {
      if (!dragging) return;
      dragging = false;
      scene.classList.remove('is-dragging');
      try { scene.releasePointerCapture(event.pointerId); } catch {}
    };

    scene.addEventListener('pointerdown', event => {
      if (event.pointerType === 'mouse' && event.button !== 0) return;
      dragging = true;
      lastX = event.clientX;
      lastY = event.clientY;
      scene.classList.add('is-dragging');
      scene.setPointerCapture(event.pointerId);
    });
    scene.addEventListener('pointermove', event => {
      if (!dragging) return;
      state.yaw += (event.clientX - lastX) * 0.65;
      state.pitch = Math.max(-35, Math.min(28, state.pitch - (event.clientY - lastY) * 0.45));
      lastX = event.clientX;
      lastY = event.clientY;
      applyState();
    });
    scene.addEventListener('pointerup', finishDrag);
    scene.addEventListener('pointercancel', finishDrag);
    scene.addEventListener('dblclick', event => {
      event.preventDefault();
      togglePaused();
    });
    scene.addEventListener('keydown', event => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        togglePaused();
      }
    });
    applyState();
  });
}

function refreshLevelObjectPreview() {
  const host = document.getElementById('levelObjectPreviewHost');
  if (host && levels[sel]) {
    host.innerHTML = renderLevelObjectPreview(levels[sel]);
    bindApproximatePreviewInteractions(host);
  }
}

/** Update material-dependent preview elements without replacing the preview
 *  cards. This preserves their drag angle and avoids restarting texture loads. */
function updateRenderedMaterial(textureId) {
  updateTextureCube(textureId);

  const faceMatch = textureId.match(/^c(\d+)f(\d+)(ft|dt)$/);
  if (faceMatch) {
    const ci = +faceMatch[1];
    const fi = +faceMatch[2];
    const type = faceMatch[3];
    const obj = levels[sel].objects[ci];
    const textureIndex = type === 'ft' ? obj.textures[fi] : obj.decorations_texture[fi];
    const spec = texturePreviewSpec(textureId, textureIndex);
    const face = document.querySelector(`[data-preview-face="${ci}:${fi}"]`);

    if (type === 'ft' && face) {
      face.style.setProperty('--face-image', `url("${spec.url}")`);
      face.style.setProperty('--face-tint', spec.tint);
      face.style.setProperty('--face-opacity', spec.opacity);
      face.title = `Object ${ci}, face D${fi}: ${TEXTURES[textureIndex]}`;
    } else if (face) {
      face.querySelectorAll('.preview-decoration').forEach(mark => {
        mark.style.setProperty('--decoration-image', `url("${spec.url}")`);
        mark.style.setProperty('--decoration-tint', spec.tint);
        mark.style.setProperty('--decoration-opacity', spec.opacity);
      });
    }
  } else if (BACKDROP_TEX_FIELDS[textureId]) {
    const isPlatform = textureId === 'bdPlatformTex';
    const textureIndex = isPlatform
      ? levels[sel].fixed.platform_texture
      : levels[sel].fixed.background_texture;
    const spec = texturePreviewSpec(textureId, textureIndex);
    const prefix = isPlatform ? '--scene-platform' : '--scene-background';
    document.querySelectorAll('.approx-preview-card').forEach(card => {
      card.style.setProperty(`${prefix}-image`, `url("${spec.url}")`);
      card.style.setProperty(`${prefix}-tint`, spec.tint);
    });
  }

  if (texturePickerPopover && !texturePickerPopover.hidden
      && texturePickerPopover.dataset.textureId === textureId) {
    const previewIndex = Number(texturePickerPopover.dataset.previewIndex);
    if (Number.isInteger(previewIndex)) setTexturePopoverPreview(textureId, previewIndex);
  }
}

/** Decoration layout edits only replace the marks on each face; the object and
 *  its current rotation remain untouched. */
function refreshRenderedDecorations() {
  levels[sel].objects.forEach((obj, ci) => {
    FACE_INDICES.forEach(fi => {
      const face = document.querySelector(`[data-preview-face="${ci}:${fi}"]`);
      if (!face) return;
      face.querySelector('.preview-decorations')?.remove();
      const decorations = renderPreviewDecorations(obj, ci, fi);
      if (decorations) face.insertAdjacentHTML('afterbegin', decorations);
    });
  });
}

function syncRenderedPreviewMaterials() {
  updateRenderedMaterial('bdPlatformTex');
  updateRenderedMaterial('bdBackgroundTex');
  levels[sel].objects.forEach((obj, ci) => {
    FACE_INDICES.forEach(fi => {
      updateRenderedMaterial(`c${ci}f${fi}ft`);
      updateRenderedMaterial(`c${ci}f${fi}dt`);
    });
  });
  refreshRenderedDecorations();
}

function shapeBtnsHtml(id, val) {
  return `<span class="shape-btns">
    ${SHAPES.map((s, i) =>
      `<button class="shape-btn${i === val ? ' active' : ''}" data-sid="${id}" data-sv="${i}" title="Decoration shape: ${s}">${SHAPE_ICONS[i]}</button>`
    ).join('')}
  </span>`;
}

// ================================================================
// Render — level list
// ================================================================
function renderLevelList() {
  const el = document.getElementById('levelList');
  if (!levels.length) {
    el.innerHTML = '<div class="empty-list">No levels yet.<br>Click + Level to start.</div>';
    return;
  }
  el.innerHTML = levels.map((lv, i) => `
    <div class="lv-item${i === sel ? ' selected' : ''}" data-i="${i}">
      <span class="lv-name">Level ${i}</span>
      <span class="lv-meta">${lv.trials.length}t</span>
      <span class="lv-btns">
        ${i > 0 ? `<button class="lv-btn" data-lmove="${i}" data-dir="-1" title="Move Up">↑</button>` : ''}
        ${i < levels.length - 1 ? `<button class="lv-btn" data-lmove="${i}" data-dir="1" title="Move Down">↓</button>` : ''}
        <button class="lv-btn lv-del" data-ldel="${i}" title="Delete">✕</button>
      </span>
    </div>
  `).join('');
}

// ================================================================
// Render — level editor
// ================================================================
function renderLevelEditor(preserveObjectPreview = false) {
  closeTexturePicker();
  const editor = document.getElementById('levelEditor');
  const placeholder = document.getElementById('placeholder');
  if (sel < 0 || sel >= levels.length) {
    editor.style.display = 'none';
    placeholder.style.display = '';
    return;
  }
  placeholder.style.display = 'none';
  editor.style.display = 'block';

  const lv = levels[sel];
  const N = lv.objects.length;
  const preservedPreview = preserveObjectPreview
    ? document.getElementById('levelObjectPreviewHost')
    : null;
  editor.innerHTML = `
    <div class="section">
      <div class="sec-title" style="display:flex;align-items:center;gap:10px;">
        <span>Objects (${N})</span>
        <span class="obj-actions">
          <button id="addObjBtn">＋ Object</button>
        </span>
      </div>
      <div class="chains-grid">
        ${lv.objects.map((obj, ci) => renderObject(obj, ci, N)).join('')}
      </div>
    </div>
    <div class="section">
      <div class="sec-title">Background</div>
      ${renderBackdrop(lv.fixed)}
      <div id="levelObjectPreviewHost">${renderLevelObjectPreview(lv)}</div>
    </div>
    <div class="section">
      <div class="sec-title">Trials (shared by all objects · ${lv.trials.length} step${lv.trials.length !== 1 ? 's' : ''})</div>
      ${renderTrials(lv.trials)}
    </div>
    <div class="section">
      <div class="sec-title">Settings</div>
      ${renderFixed(lv.fixed, lv)}
    </div>
  `;

  if (preservedPreview) {
    document.getElementById('levelObjectPreviewHost')?.replaceWith(preservedPreview);
  }

  attachEvents();
  bindApproximatePreviewInteractions(editor);
  if (preservedPreview) syncRenderedPreviewMaterials();
}

function renderObject(obj, ci, N) {
  const CHAIN_COLORS = ['var(--chain-a)', 'var(--chain-b)', '#a06cd5', '#5cc9a7', '#e8a735', '#e05555'];
  const colorVar = CHAIN_COLORS[ci % CHAIN_COLORS.length];

  const td = obj.target_door;
  const doorSelVal = obj._type || (td === EDITOR_TYPE1_DOOR ? 'type1' : td === EDITOR_TYPE2_DOOR ? 'type2' : 'custom');
  const isCustom = doorSelVal === 'custom';

  const doorSelect = `<span class="target-door-wrap">
    <select class="door-sel" data-ci="${ci}" title="Type 1 and Type 2 apply the editor's shared-face rules. Custom leaves all three faces independent.">
      <option value="type1"${doorSelVal === 'type1' ? ' selected' : ''}>Type 1 (door ${EDITOR_TYPE1_DOOR})</option>
      <option value="type2"${doorSelVal === 'type2' ? ' selected' : ''}>Type 2 (door ${EDITOR_TYPE2_DOOR})</option>
      <option value="custom"${doorSelVal === 'custom' ? ' selected' : ''}>Custom…</option>
    </select>
    <span class="custom-door-label" style="display:${isCustom ? 'inline-flex' : 'none'}; align-items:center; gap:3px; font-size:11px; color:var(--text-dim);">
      Door <input type="number" class="door-custom-in" data-ci="${ci}" min="0" max="${N_DOORS - 1}" value="${td}" title="Target door index from 0 to ${N_DOORS - 1}.">
    </span>
    <span class="obj-ctrl-btns">
      ${ci > 0 ? `<button data-omove="${ci}" data-dir="-1" title="Move Up">↑</button>` : ''}
      ${ci < N - 1 ? `<button data-omove="${ci}" data-dir="1" title="Move Down">↓</button>` : ''}
      ${N > 1 ? `<button class="obj-del" data-odel="${ci}" title="Delete">✕</button>` : ''}
    </span>
  </span>`;

  return `
  <div class="obj-card" style="border-color:${colorVar}">
    <div class="obj-header" style="background:color-mix(in srgb, ${colorVar} 15%, transparent);color:${colorVar}">
      <span>Object ${ci}</span>
      ${doorSelect}
    </div>
    <div class="face-table-wrap">
      <table class="face-table">
        <thead><tr>
          <th title="Face D0, D1, or D2.">Face</th>
          <th title="Face color mask. Alpha 0 keeps the original texture; alpha 1 applies the selected RGB fully.">Face color</th>
          <th title="Top view of the object. The yellow dot marks this object's target door.">Target door</th>
          <th title="Material shown on this face.">Face texture</th>
          <th title="0 places decorations on an even grid. A positive seed gives repeatable random positions.">Seed <span style="color:var(--accent);font-weight:700;" title="0 uses an even grid.">(0 = grid)</span></th>
          <th title="Number of decorations on this face. 0 shows none.">Count</th>
          <th title="Size of each decoration in game units.">Size</th>
          <th title="Distance the decoration stands out from the face. 0 is flat.">Depth</th>
          <th title="Shape of each decoration.">Shape</th>
          <th title="Fixed angle from 0 to 359 degrees. Rand gives every decoration its own angle.">Rotation</th>
          <th title="Material shown on the decorations.">Decoration texture</th>
          <th title="Decoration color mask. Alpha 0 keeps the original texture; alpha 1 applies the selected RGB fully.">Decoration color</th>
        </tr></thead>
        <tbody>
          ${FACE_INDICES.map(fi => renderFaceRow(obj, ci, fi)).join('')}
        </tbody>
      </table>
    </div>
  </div>`;
}

function isLocked(obj, ci, fi) {
  const isType2 = obj._type === 'type2';
  const isCustom = obj._type === 'custom';

  if (isCustom) return false;
  if (fi === 2 && isType2) return true;

  return false;
}

function renderFaceRow(obj, ci, fi) {
  const p = `c${ci}f${fi}`;
  const locked = isLocked(obj, ci, fi);
  const trClass = locked ? ' class="face-locked"' : '';
  const isType2 = obj._type === 'type2';
  const isCustom = obj._type === 'custom';

  // Changed ${fi} to D${fi} here:
  let badge = `<span class="face-badge f${fi}">D${fi}</span>`;
  let constraintBadge = '';
  
  if (!isCustom) {
    if (fi === 0) {
      constraintBadge = `<span class="face-shared-badge">⬡ shared</span>`;
    } else if (fi === 1 && isType2) {
      constraintBadge = `<span class="face-mirror-badge">↕ mirror</span>`;
    } else if (fi === 2 && isType2) {
      constraintBadge = `<span class="face-mirror-badge">= f1</span>`;
    }
  }

  const faceCell = `<div class="face-label-wrap">${badge}${constraintBadge}</div>`;
  
  // Changed F0, F1, F2 to D0, D1, D2 here:
  const doorIndicator = `
    <div class="door-indicator-cell">
      <div class="tri-mini">
        <div class="golden-dot" style="${getDoorStyle(obj.target_door)}"></div>
        <span class="tri-label" style="top: 30px; left: -5px; color: var(--accent);">D0</span>
        <span class="tri-label" style="top: 5px; left: 10px;">D1</span>
        <span class="tri-label" style="top: 5px; left: -18px;">D2</span>
      </div>
    </div>
  `;

  return `<tr${trClass}>
    <td>${faceCell}</td>
    <td>${colorInputHtml(`${p}fc`, obj.colors[fi])}</td>
    
    <td>${doorIndicator}</td>

    <td>${texSelectHtml(`${p}ft`, obj.textures[fi])}</td>
    <td><input type="number" class="num-xs face-in" data-chain="${ci}" data-face="${fi}" data-field="decorations_seeds" value="${obj.decorations_seeds[fi]}" min="0" max="9007199254740991" step="1" inputmode="numeric" pattern="\\d*" title="0 uses an even grid. A positive seed gives repeatable random positions."></td>
    <td><input type="number" class="num-xs face-in" data-chain="${ci}" data-face="${fi}" data-field="decorations_count" value="${obj.decorations_count[fi]}" min="0" step="1" title="Number of decorations. 0 shows none."></td>
    <td><input type="number" class="num-xs face-in" data-chain="${ci}" data-face="${fi}" data-field="decorations_size" value="${obj.decorations_size[fi]}" min="0" step="0.01" title="Decoration size in game units."></td>
    <td><input type="number" class="num-xs face-in" data-chain="${ci}" data-face="${fi}" data-field="decorations_thickness" value="${obj.decorations_thickness[fi]}" min="0" step="0.01" title="How far the decoration stands out from the face. 0 is flat."></td>
    <td>${shapeBtnsHtml(`${p}sh`, obj.decorations_shape[fi])}</td>
    <td>${rotationInputHtml(ci, fi, obj.decorations_rotation[fi])}</td>
    <td>${texSelectHtml(`${p}dt`, obj.decorations_texture[fi])}</td>
    <td>${colorInputHtml(`${p}dc`, obj.decorations_color[fi])}</td>
  </tr>`;
}

/* Rotation widget: a "Rand" toggle and a degrees number input.
 * Value semantics:
 *   integer ≥ 0 → fixed rotation in degrees (multiples of 360 ≡ 0)
 *   -1          → random rotation per decoration on the face
 */
function rotationInputHtml(ci, fi, val) {
  const isRandom = val < 0;
  return `<span class="rot-wrap" data-chain="${ci}" data-face="${fi}">
    <button class="rot-rand-btn${isRandom ? ' active' : ''}" data-rrand="${ci}-${fi}" title="Give every decoration a separate random angle.">Rand</button>
    <input type="number" class="num-xs rot-deg-in" data-rdeg="${ci}-${fi}"
           min="0" max="359" step="15" value="${isRandom ? 0 : val}"
           title="Fixed decoration angle from 0 to 359 degrees."
           ${isRandom ? 'disabled' : ''}>
  </span>`;
}

// Render — trials
// ================================================================
/** Per-level backdrop: the ground plane the scene stands on and the curved
 *  wall behind it. The mask's alpha is its strength — 0 shows the bare
 *  texture, 1 washes it fully toward the picked colour. */
function renderBackdrop(fixed) {
  const row = (label, hint, texId, texVal, maskId, mask) => `
    <div class="trial-row">
      <span class="trial-field" title="${hint}"><strong>${label}</strong></span>
      <span class="trial-field"><span>Texture</span>${texSelectHtml(texId, texVal)}</span>
      <span class="trial-field" title="RGB sets the mask color. Alpha sets its strength: 0 keeps the original texture; 1 applies the full color.">
        <span>Color mask</span>${colorInputHtml(maskId, mask)}
      </span>
    </div>`;
  return `<div class="trials-list">
    ${row('Platform', 'The ground plane the scene stands on.',
          'bdPlatformTex', fixed.platform_texture, 'bdPlatformMask', fixed.platform_color_mask)}
    ${row('Background', 'The curved wall behind the object.',
          'bdBackgroundTex', fixed.background_texture, 'bdBackgroundMask', fixed.background_color_mask)}
  </div>`;
}

function renderTrials(trials) {
  const rows = trials.map((t, ti) => `
    <div class="trial-row">
      <span class="trial-num">${ti}</span>
      <span class="trial-field" title="A correct answer advances only if its attempt number and elapsed time are both within their Advance limits. 0 disables advancement by attempts."><span>Advance ≤</span>
        <input type="number" class="num-xs trial-in" data-ti="${ti}" data-tf="nr_attempts_to_win" value="${t.nr_attempts_to_win}" min="0" step="1">
        <span>att</span>
      </span>
      <span class="trial-field" title="Failed checks up to this attempt number show a hint on the target door. 0 disables early hints."><span>Hint ≤</span>
        <input type="number" class="num-xs trial-in" data-ti="${ti}" data-tf="nr_attempts_suggestion" value="${t.nr_attempts_suggestion}" min="0" step="1">
        <span>att</span>
      </span>
      <span class="trial-field" title="A failed check moves back when its attempt number is greater than this value. 0 means the first failure."><span>Move back ></span>
        <input type="number" class="num-xs trial-in" data-ti="${ti}" data-tf="nr_attempts_to_retroceed" value="${t.nr_attempts_to_retroceed}" min="0" step="1">
        <span>att</span>
      </span>
      <span class="trial-field" title="A correct answer advances only if elapsed time and its attempt number are both within their Advance limits. 0 seconds effectively disables advancement."><span>Advance ≤</span>
        <input type="number" class="num-sm trial-in" data-ti="${ti}" data-tf="elapsed_time_to_win" value="${t.elapsed_time_to_win}" min="0" step="0.5">
        <span>s</span>
      </span>
      <span class="trial-field" title="If this time expires without a correct answer, the object moves back one trial step."><span>Move back ></span>
        <input type="number" class="num-sm trial-in" data-ti="${ti}" data-tf="elapsed_time_to_retroceed" value="${t.elapsed_time_to_retroceed}" min="0" step="0.5">
        <span>s</span>
      </span>
      <span class="trial-field" title="On the final failed attempt, light every base door red. Off lights only the target door red.">
        <label><input type="checkbox" class="trial-in" data-ti="${ti}" data-tf="show_all" ${t.show_all ? 'checked' : ''}> all doors red on failure</label>
      </span>
      <span class="trial-btns">
        ${ti > 0 ? `<button data-tmove="${ti}" data-dir="-1" title="Move this trial step up.">↑</button>` : ''}

        <button class="del-btn" data-tdel="${ti}" title="Delete this trial step.">✕</button>
      </span>
    </div>
  `).join('');
  return `<div class="trials-list">${rows}
    <button class="add-btn" id="addTrialBtn" title="Add a trial step after the current last step.">+ Add Trial Step</button>
  </div>`;
}
